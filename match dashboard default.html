<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>match dashboard default</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Layout (v4 command centre) with the earlier purple theme: lavender-white canvas, violet primary, teal / amber / coral data colours. */
/* v3 notes: light product shell in the reference style: icon rail, slim top bar, promo banner, underlined tabs, a main column of stat cards and one trend chart, and a right column of widgets. Purple is the accent; orange-coral is the single warm pop. */
:root{
  --font-display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --bg:#FAF9FD; --surface:#FFFFFF; --surface-2:#F4F0FC; --line:#E9E4F3;
  --ink:#17121F; --ink-2:#6A6480;
  --side:#FFFFFF; --bar:#FFFFFF; --btn:#7233E6; --btn-ink:#FFFFFF;
  --accent:#7233E6; --on-accent:#FFFFFF; --pop:#FF5A3C; --orchid:#B79CF5;
  --d1:#7233E6; --d2:#16998A; --d3:#F0A030; --d4:#FF5A3C;
  --lav:#EAE2FD; --rose:#FFE3DD; --mint:#D6F3E6; --sand:#FDEFCB;
  --good:#17724A; --good-bg:#DFF3E8; --warn:#8F5A0C; --warn-bg:#FBEBCB; --bad:#B4283A; --bad-bg:#FADFE2; --info:#3B4BB5; --info-bg:#E3E6FB;
  --shadow:0 1px 2px rgba(40,20,90,.05),0 8px 24px rgba(40,20,90,.07);
  --scrim:rgba(20,10,40,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0B14; --surface:#161120; --surface-2:#221A33; --line:#30284A;
  --ink:#F3EEFB; --ink-2:#B1A8C6;
  --side:#120E1B; --bar:#120E1B; --btn:#A98BFF; --btn-ink:#1A0F36;
  --accent:#B39CFF; --on-accent:#1A0F36; --pop:#FF8A70; --orchid:#8467D6;
  --d1:#B39CFF; --d2:#4CC9B8; --d3:#F2B857; --d4:#FF8A70;
  --lav:#2A2450; --rose:#4A2A30; --mint:#173A2D; --sand:#4A3714;
  --good:#6FD7A5; --good-bg:#16382A; --warn:#F0C26B; --warn-bg:#3F3012; --bad:#FF9AA6; --bad-bg:#47202A; --info:#A9B4FF; --info-bg:#262B5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0B14; --surface:#161120; --surface-2:#221A33; --line:#30284A;
  --ink:#F3EEFB; --ink-2:#B1A8C6;
  --side:#120E1B; --bar:#120E1B; --btn:#A98BFF; --btn-ink:#1A0F36;
  --accent:#B39CFF; --on-accent:#1A0F36; --pop:#FF8A70; --orchid:#8467D6;
  --d1:#B39CFF; --d2:#4CC9B8; --d3:#F2B857; --d4:#FF8A70;
  --lav:#2A2450; --rose:#4A2A30; --mint:#173A2D; --sand:#4A3714;
  --good:#6FD7A5; --good-bg:#16382A; --warn:#F0C26B; --warn-bg:#3F3012; --bad:#FF9AA6; --bad-bg:#47202A; --info:#A9B4FF; --info-bg:#262B5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:650;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.ic{flex:none;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
body::before{background:var(--bar)!important}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:60px;background:color-mix(in srgb,var(--bar) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);display:flex;align-items:center;gap:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ptitle{font-family:var(--font-display);font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:4px}
.gs{position:relative;width:min(320px,34vw)}
.gs>.ic{position:absolute;left:12px;top:11px;color:var(--ink-2)}
.gs input{height:38px;border-radius:10px;padding-left:36px;padding-right:62px;background:var(--surface);border-color:var(--line);font-size:13.5px}
.gs kbd{position:absolute;right:8px;top:8px;font:600 10.5px var(--font-body);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink-2);background:var(--surface-2)}
.gs-res{position:absolute;left:0;right:0;min-width:300px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:60;max-height:70dvh;overflow:auto}
.gs-res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.gs-res button:hover{background:var(--surface-2)}
.gs-res small{margin-left:auto;color:var(--ink-2);white-space:nowrap}
.gs-res .none{padding:14px;color:var(--ink-2)}
.iconbtn.mob-only{display:none}
.sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.bar .iconbtn{border:1px solid var(--line);background:var(--surface)}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--pop);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bar);box-sizing:content-box}
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:54px;width:min(350px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:55;padding:8px}
.pop.pu{position:fixed;left:16px;right:auto;top:auto;bottom:78px;width:240px}
.pop h3{font-size:14px;padding:8px 10px}
.pop .row{display:flex;gap:10px;padding:10px;border-radius:12px;text-align:left;width:100%;align-items:flex-start}
.pop .row:hover{background:var(--surface-2)}
.pop .row.unread::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pop);margin-top:6px;flex:none}
.pop .row small{color:var(--ink-2);display:block}

/* shell + labelled sidebar */
.shell{display:flex;min-height:100dvh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:72px;flex:none;background:var(--side);border-right:1px solid var(--line);color:var(--ink-2);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;transition:width .2s;z-index:45}
.shell.exp .side{width:252px}
.brand{display:flex;align-items:center;gap:11px;padding:0 4px 8px;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:18px;white-space:nowrap}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#FF7A59,#E0407B);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.brand small{display:block;font-family:var(--font-body);font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-2)}
.nav-g{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);opacity:.75;padding:14px 12px 6px;white-space:nowrap;height:34px;overflow:hidden}
.shell:not(.exp) .nav-g{opacity:0;height:8px;padding:0}
.nav-i{display:flex;align-items:center;gap:13px;height:40px;padding:0 12px;border-radius:10px;color:var(--ink-2);white-space:nowrap;width:100%;text-align:left;flex:none}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--btn);color:var(--btn-ink)}
.nav-i .lbl,.brand .lbl,.side-foot .lbl{opacity:0;transition:opacity .12s;font-weight:600}
.shell.exp .nav-i .lbl,.shell.exp .brand .lbl,.shell.exp .side-foot .lbl{opacity:1}
.side-foot{margin-top:auto;padding:12px 4px 0;display:flex;align-items:center;gap:10px;color:var(--ink);white-space:nowrap;text-align:left;border-top:1px solid var(--line)}
.side-foot small{display:block;color:var(--ink-2);font-size:11.5px;font-weight:500}
.scrim-nav{display:none}
@media (max-width:860px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:272px;transform:translateX(-100%);transition:transform .22s;padding-top:max(16px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));z-index:65}
  .shell.exp .side{width:272px}
  .shell.mob .side{transform:none}
  .side .lbl,.side .nav-g{opacity:1!important;height:34px}
  .shell.mob .scrim-nav{display:block;position:fixed;inset:0;z-index:64;background:var(--scrim)}
  .pop.pu{left:16px;bottom:16px}
}
@media (max-width:720px){
  .gs{display:none}
  .gs.open{display:block;position:absolute;left:14px;right:14px;top:54px;width:auto;z-index:70}
  .iconbtn.mob-only{display:grid}
}

/* page */
main{min-width:0;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.phead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.phead h1{font-size:26px;line-height:1.15}
.phead p{color:var(--ink-2);margin-top:4px;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:21px}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.panel{background:var(--surface-2);border-radius:18px;padding:18px;min-width:0}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:600;white-space:nowrap;border:1px solid var(--btn)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.lnk{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.lnk:hover{text-decoration:underline}

/* pills, chips, segmented */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-size:11px;margin-left:6px;opacity:.7}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 240px;max-width:420px}
.search input{padding-left:38px;border-radius:999px;height:40px}
.search .ic{position:absolute;left:13px;top:11px;color:var(--ink-2)}
.toolbar select{width:auto;border-radius:999px;height:40px}

/* kpi + hello */
.hello{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
.hello h1{font-size:28px;line-height:1.15}
.hello p{color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;transition:transform .12s}
.kpi:hover{transform:translateY(-2px)}
.kpi span{color:var(--ink-2);font-size:12.5px}
.kpi b{font-family:var(--font-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-2)}

/* course card */
.course{display:flex;flex-direction:column;overflow:hidden}
.course svg.bn{width:100%;height:auto;display:block;aspect-ratio:16/7}
.course .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.course h3{font-size:16px;line-height:1.25}
.course.off{opacity:.62}
.prog{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.cacts{display:flex;gap:4px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.cacts .btn{flex:1}

/* promo */
.promo{border-radius:20px;padding:26px;display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--surface-2);overflow:hidden;min-width:0}
.promo h2{font-size:30px;line-height:1.05;margin-bottom:10px}
.promo p{color:var(--ink-2);max-width:34ch;margin-bottom:16px;font-size:13px}
.promo .art{flex:none;width:130px}
@media (max-width:520px){.promo .art{display:none}}
.mini-c{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:11px;color:var(--ink-2);width:170px}
.stack{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}

/* charts */
.chart-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.chart-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chart-h h2{font-size:21px}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
svg text{fill:var(--ink-2);font-family:var(--font-body)}
.donut-wrap{position:relative;max-width:260px;margin:0 auto;width:100%}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{font-family:var(--font-display);font-size:30px;display:block;line-height:1}
.donut-c span{font-size:12px;color:var(--ink-2)}
.bar-g{cursor:pointer}
.bar-g:hover rect.b{filter:brightness(1.1)}

/* feature tiles */
.ftile{display:flex;gap:16px;padding:18px;align-items:flex-start}
.ftile .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ftile h3{font-size:17px;margin-bottom:2px}
.ftile p{color:var(--ink-2);margin-bottom:12px;font-size:13px}

/* meetings */
.meet-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.meet{padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.meet .top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:6px}
.meet .top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.times{display:flex;gap:8px;width:100%}
.times div{flex:1;background:var(--orchid);color:#1E0B20;border-radius:6px;padding:4px;font-size:11px;line-height:1.3}
.times b{display:block;font-size:13px}

/* jobs panel */
.tabbar{background:var(--bar);color:#fff;border-radius:16px 16px 0 0;display:flex;gap:6px;padding:10px 14px 0}
.tabbar button{padding:10px 26px;border-radius:12px 12px 0 0;font-family:var(--font-display);font-size:18px;color:#fff;opacity:.85}
.tabbar button.on{background:var(--surface);color:var(--ink);opacity:1}
.jobs-body{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.carousel{display:flex;align-items:center;gap:10px}
.car-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;flex:1;min-width:0;padding:4px;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.jcard{flex:0 0 min(260px,78%);scroll-snap-align:start;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface)}
.jcard .jt{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.jcard .jt h4{font-family:var(--font-display);font-size:16px}
.jcard .jt div{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink)}
.jcard .jf{background:var(--surface);color:var(--ink);padding:10px 14px;display:flex;justify-content:center;border-top:1px solid var(--line);font-weight:600}
.jcard .jf:hover{background:var(--surface-2)}
.round{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.round:hover{background:var(--surface-2)}
.t-lav{background:var(--lav)} .t-rose{background:var(--rose)} .t-mint{background:var(--mint)} .t-sand{background:var(--sand)} .t-orchid{background:color-mix(in srgb,var(--orchid) 45%,var(--surface))}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);text-align:left;padding:10px 14px;background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:17px}

/* premium */
.cand{padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.cand.sel{outline:2px solid var(--accent)}

/* ===== v5 spacing pass: more air between sections, inside cards and between list rows ===== */
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px}

.page.wide,.page{gap:var(--sp-6)}
main>.dh{margin-bottom:var(--sp-6)}
main>.kps{margin-bottom:var(--sp-6)}
/* page header */
.dh{gap:var(--sp-4);padding-bottom:var(--sp-1)}
.dh h1{font-size:32px;line-height:1.2}
.dh p{margin-top:var(--sp-2);line-height:1.6;font-size:14.5px}
/* KPI strip */
.kps{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--sp-4)}
.kp{padding:20px;gap:var(--sp-4);border-radius:16px}
.kp-i{width:46px;height:46px;border-radius:12px}
.kp-t{gap:2px}
.kp-t span{margin-bottom:2px}
.kp-t b{font-size:30px;margin:2px 0 4px}
/* board grid */
.bd{gap:var(--sp-5)}
.pn{padding:var(--sp-5);gap:var(--sp-5);border-radius:16px}
.pn-h{gap:var(--sp-4);align-items:center}
.pn-h h2{font-size:18px;line-height:1.3}
.pn-h .small{display:block;margin-top:4px;line-height:1.5}
.pn .list{gap:var(--sp-3)!important}
.pn .sub-h{margin:var(--sp-5) 0 var(--sp-3)!important;font-size:15px}
.pn .sub-h:first-child{margin-top:0!important}
/* funnel */
.fns{gap:var(--sp-7)}
.fn-t{margin-bottom:var(--sp-4)}
.fn-r{gap:6px;margin-bottom:var(--sp-5)}
.fn-r:last-child{margin-bottom:0}
.fn-b{height:12px}
.fn-c{margin-top:2px}
/* attention + agenda + closing rows */
.at{padding:14px 16px;gap:var(--sp-4);border-radius:14px}
.at .grow b{margin-bottom:2px}
.at-i{width:38px;height:38px}
.mrow{padding:14px 16px;gap:var(--sp-4);border-radius:14px}
.mtime{width:62px;padding:8px 0}
.cl{padding:14px 0;gap:var(--sp-4)}
.cl small{margin-top:2px}
/* timeline */
.tl-row{grid-template-columns:170px minmax(0,1fr)}
.tl-l{padding:10px 16px 10px 0}
.tl-track{height:42px}
.tl-bar{top:10px;height:22px}
.tl-dot{top:15px}
.tl hd,.tl-hd{height:32px}
.tl-hd .tl-track{height:32px}
.pn .legend{gap:var(--sp-4) var(--sp-5)!important;margin-top:var(--sp-4)!important}
.lg{gap:8px}
/* campus reach */
.rch{gap:var(--sp-6)}
.tmap{gap:6px}
.li{padding:12px 16px;gap:var(--sp-3);border-radius:12px}
.li .grow b{margin-bottom:2px}
.rch .lnk{margin-top:var(--sp-3)!important}
/* talent pool */
.hb{grid-template-columns:minmax(90px,150px) 1fr 28px;gap:var(--sp-4);padding:6px 0}
.hb i{height:10px}
.hist{gap:var(--sp-4);padding-top:var(--sp-2)}
.hist div{gap:var(--sp-2)}
/* tables inside panels */
.pn .tw{border:0;border-radius:0}
.pn th{padding:12px 16px}
.pn td{padding:16px}
/* learning cards */
.lc{padding:16px 18px;gap:8px;border-radius:14px}
.lc .prog{margin-top:var(--sp-2)}
/* jobs card */
.jobs-h{padding:var(--sp-5) var(--sp-5) var(--sp-4);gap:var(--sp-4)}
.jobs-card .carousel{padding:0 var(--sp-5) var(--sp-5);gap:var(--sp-4)}
.car-track{gap:var(--sp-4);padding:var(--sp-1)}
.jcard .jt{padding:var(--sp-5) 20px;gap:10px}
.jcard .jf{padding:14px 20px}
/* feature tiles */
.ftile{padding:var(--sp-5);gap:20px}
.ftile h3{margin-bottom:6px}
.ftile p{margin-bottom:var(--sp-4);line-height:1.55}
/* controls get a little more room too */
.seg{padding:4px}
.btn.sm{height:34px;padding:0 16px}
.acts{gap:var(--sp-3)}
.pill{height:24px;padding:0 10px}
/* top bar */
.bar{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
/* let KPI captions wrap instead of clipping */
.kp-t small{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.kp-t span{line-height:1.3}
/* tablets and phones: keep the air, trim the margins */
@media (max-width:1120px){.bd{gap:var(--sp-4)}.fns{gap:var(--sp-6)}}
@media (max-width:720px){
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
  .page,.page.wide{gap:var(--sp-5)}
  main>.dh,main>.kps{margin-bottom:var(--sp-5)}

  .pn{padding:20px;gap:20px}
  .kp{padding:16px}

  .jobs-h{padding:20px 20px 12px}

}

/* refined Public Skill Library rows */
.pl{gap:6px;padding:12px 14px}

/* jobs + event request cards (list design) */

/* workforce premium full width */
.fb-wfm{flex-direction:row;align-items:stretch;justify-content:space-between;gap:28px;padding:28px 30px;isolation:isolate;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(120deg,#12062B 0%,#2C1058 48%,#5B21B6 100%);box-shadow:0 24px 60px rgba(40,10,100,.28)}
.fb-wfm h2{background:linear-gradient(90deg,#fff,#D8C5FF);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px}
.wfx-l{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.wfx-l .wf-tiles{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.wfx-r{flex:0 1 380px;min-width:0;display:flex;align-items:center;position:relative;z-index:1}
.wfx-card{width:100%;border-radius:22px;padding:20px 22px 16px;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(10,0,40,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.wfx-stage{position:relative;height:196px}
.wfx-s{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;opacity:0;animation:wfxs 33s infinite;animation-delay:calc(var(--i)*3s);color:#fff}
.wfx-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#7233E6,#C04FA0);box-shadow:0 8px 20px rgba(192,79,160,.45)}
.wfx-s h3{font-family:var(--font-display);font-size:18px;line-height:1.25;margin:0}
.wfx-f{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:2px solid rgba(255,255,255,.35)}
.wfx-f b{font-size:13px}
.wfx-f span{font-size:12px;line-height:1.4;opacity:.78;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wfx-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.wfx-dots i{display:block;width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);animation:wfxd 33s infinite;animation-delay:calc(var(--i)*3s)}
.wfx-o{position:absolute;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;animation:wfxf 9s ease-in-out infinite}
.wfx-o1{width:260px;height:260px;right:-40px;top:-80px;background:rgba(192,79,160,.55)}
.wfx-o2{width:220px;height:220px;left:30%;bottom:-120px;background:rgba(80,140,255,.4);animation-delay:-4s}
@keyframes wfxs{0%{opacity:0;transform:translateY(14px) scale(.98)}1.5%,8%{opacity:1;transform:none}9.5%,100%{opacity:0;transform:translateY(-10px) scale(.98)}}
@keyframes wfxd{0%,9%{width:22px;background:#fff}9.1%,100%{width:6px;background:rgba(255,255,255,.35)}}
@keyframes wfxf{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-16px)}}
@media (max-width:900px){.fb-wfm{flex-direction:column;padding:22px}.wfx-r{flex-basis:auto}}
@media (prefers-reduced-motion:reduce){.wfx-s,.wfx-dots i,.wfx-o{animation:none}.wfx-s:first-child{opacity:1}}

.nav-i.nav-p.workforce.on{background:color-mix(in srgb,#7233E6 10%,var(--surface));border-color:color-mix(in srgb,#7233E6 40%,transparent);color:var(--ink)}

.side-foot{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}

/* ATS / Workforce pages */
.mod-hero{border-radius:24px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;color:#fff}
.mod-hero.ats{background:radial-gradient(circle at 100% 0,rgba(213,242,75,.22),transparent 45%),linear-gradient(135deg,#0F2019,#183629 70%,#24503B)}
.mod-hero.workforce{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.16),transparent 45%),linear-gradient(135deg,#12062B,#2C1058 50%,#5B21B6)}
.mod-hero h2{color:#fff;font-size:24px;margin:0}
.mod-hero p{margin:8px 0 0;opacity:.86;max-width:60ch;line-height:1.55}
.mod-st{display:flex;gap:12px}

/* tree menu */
.shell.exp .side{width:272px}
.nav-gh{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 12px 6px;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}

.np-row{position:relative;display:flex;align-items:center}
.nav-i.nav-p{flex:1;min-width:0;padding-right:36px}
.nav-p .np-t b{font-size:13.5px;white-space:nowrap}
.nav-p .np-t small{display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-p .np-b{margin:0;font-style:normal;font-size:9px;padding:2px 6px}
.np-tg{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}

.nav-sub{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);text-align:left;white-space:nowrap}

.ns-e{width:20px;text-align:center;font-size:14px;flex:none}
.nav-ch>.nav-i{height:38px}
.shell:not(.exp) .nav-gh{display:none}
.shell:not(.exp) .nav-ch{margin:0;padding:0;border:0}
.shell:not(.exp) .nav-ch[hidden]{display:flex!important}
.shell:not(.exp) .nav-ch>.nav-i::after,.shell:not(.exp) .nav-ch>.np-row::before{display:none}
.shell:not(.exp) .np-tg,.shell:not(.exp) .np-ch{display:none!important}
.shell:not(.exp) .nav-i.nav-p{padding-right:8px}

.mod-c.flash{animation:modflash 1.6s ease}

/* brand logo + fixed profile */

.side-foot{position:sticky;bottom:0;z-index:3;margin-top:auto;outline:10px solid var(--side)}

.pop.pu2{z-index:80;width:min(300px,calc(100vw - 32px));padding:0;overflow:hidden;background:var(--surface);border-radius:20px;box-shadow:0 18px 48px rgba(20,10,40,.22)}

.pu2 .pu-tx small{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pu2 .pu-plus{border:1px dashed var(--ink-2);border-radius:50%}

.pu2 .pu-foot b{font-size:15.5px}

/* premium workforce banner */
.fb-wfm{padding:20px 26px;gap:26px;border:1px solid rgba(255,255,255,.14);background:radial-gradient(760px 380px at 88% -15%,rgba(192,79,160,.5),transparent 62%),radial-gradient(640px 340px at 8% 125%,rgba(90,130,255,.32),transparent 62%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(120deg,#0E0524 0%,#25104F 48%,#4A1D96 100%);box-shadow:0 30px 70px rgba(40,10,100,.32),inset 0 1px 0 rgba(255,255,255,.2)}

.wfx-h .fb-body{display:flex;flex-direction:column;align-items:flex-start;gap:3px}

.fb-wfm .wf-t:not(.ai){background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-weight:600;min-height:50px;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}

.fb-wfm .wf-t.ai{position:relative;background:linear-gradient(100deg,#fff 0%,#F3E9FF 60%,#E8D8FF 100%);box-shadow:0 0 0 1.5px rgba(255,255,255,.55),0 12px 34px rgba(192,79,160,.5);gap:12px}

/* ATS pipeline visual */
.ats-prev.ats2{flex:0 1 420px;gap:9px;padding:12px 16px;color:#EAF2E4;background:linear-gradient(160deg,rgba(213,242,75,.14),rgba(255,255,255,.04));border:1px solid rgba(213,242,75,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 22px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.ats2-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ats2-h b{font-family:var(--font-display);font-size:15px;color:#fff}

.ats2-f{display:flex;flex-direction:column;gap:5px}
.ats2-r{display:grid;grid-template-columns:78px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:12px;line-height:1.2}

.ats2-r i{display:block;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.ats2-r u{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8FD14F,#D5F24B);box-shadow:0 0 12px rgba(213,242,75,.45)}

.ats2-t{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.ats2-avs{display:flex;flex:none;padding-left:6px}
.ats2-avs i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:700;color:#12241C;background:#D5F24B;border:2px solid #17301F;margin-left:-4px}

.ats2-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ats2-tx b{font-size:12.5px;color:#fff}
.ats2-tx small{font-size:11px;color:rgba(234,242,228,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ats2-t em{flex:none;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#D5F24B;color:#12241C}
.wfx-stage{height:176px}
.wfx-s{gap:8px}
.wfx-dots{margin-top:8px}
/* KPI cards */
.kpx{flex-direction:column;align-items:stretch;gap:0;padding:18px 20px;position:relative;transition:border-color .15s,transform .15s,box-shadow .15s}
.kpx:hover{transform:translateY(-2px)}
.kpx.t1{--k:var(--accent)}.kpx.t2{--k:var(--d2)}.kpx.t3{--k:var(--d3)}.kpx.t4{--k:var(--pop)}

.kpx-s{display:block;margin-top:9px;font-size:12.5px;color:var(--ink-2);line-height:1.35;white-space:normal}

/* date chip -> calendar */
.datechip{cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}

/* calendar modal */
.cal{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}

.cal-w span{text-align:center;font-size:11px;font-weight:700;color:var(--ink-2)}

.cal-f{display:flex;flex-direction:column;gap:6px}
.cal-fc{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);text-align:left}

.cal-r{min-width:0;display:flex;flex-direction:column;gap:10px}

function openModal(spec,d={},m={}){S.modal=spec;S.d=d;S.m=m;renderModal()}
function closeModal(){S.modal=null;S.d={};S.m={};renderModal()}
function renderModal(){keep(()=>{
  const m=S.modal,el=$('#modal');
  if(!m){el.innerHTML='';document.body.classList.remove('lock');return}
  const old=$('.mbody',el);const st=old?old.scrollTop:0;const sc=[...el.querySelectorAll('.sc')].map(x=>x.scrollTop);
  const foot=m.foot===false?'':(m.foot?tv(m.foot):`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="saveModal">${m.cta||'Save'}</button>`);
  el.innerHTML=`<div class="scrim" data-act="closeScrim"><div class="modal ${m.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(String(tv(m.title)).replace(/<[^>]+>/g,''))}"><div class="mhead"><h2>${tv(m.title)}</h2><button class="iconbtn" data-act="closeModal" aria-label="Close">${ic('x')}</button></div><div class="mbody">${m.body()}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div></div>`;
  const nb=$('.mbody',el);if(nb)nb.scrollTop=st;
  el.querySelectorAll('.sc').forEach((x,i)=>{if(sc[i])x.scrollTop=sc[i]});
  document.body.classList.add('lock');
})}
const up=()=>{render();renderModal()};
function go(v,q){S.view=v;if(q)Object.assign(S.q,q);S.mob=false;S.notif=false;S.userMenu=false;S.menu=null;try{location.hash=v}catch(e){}closeModal();render();window.scrollTo(0,0)}

/* generic form field bound to the draft S.d */
function F(n,l,t='text',o={}){
  const v=S.d[n]??'';const id='f_'+n;const lv=o.live?' data-live="1"':'';let inp;
  if(t==='check')return `<label class="chk ${o.span?'span2':''}" for="${id}"><input type="checkbox" id="${id}" data-d="${n}"${lv} ${S.d[n]?'checked':''}> <span>${l}</span></label>`;
  if(t==='textarea')inp=`<textarea id="${id}" data-d="${n}"${lv} rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>`;
  else if(t==='select')inp=`<select id="${id}" data-d="${n}"${lv}>${o.opts.map(x=>{const [a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else inp=`<input id="${id}" data-d="${n}"${lv} type="${t}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.min!=null?`min="${o.min}"`:''} ${o.max!=null?`max="${o.max}"`:''} ${o.step?`step="${o.step}"`:''}>`;
  return `<div class="field ${o.span?'span2':''}"><label for="${id}">${l}</label>${inp}${o.hint?`<small>${o.hint}</small>`:''}</div>`;
}
/* inputs */
function onIn(e){
  const el=e.target,D=el.dataset;
  if(D.gs!==undefined){if(e.type==='input'){S.gsq=el.value;keep(renderBar)}return}
  if(e.type==='change'&&(el.tagName==='TEXTAREA'||['text','search','email','number','url','password'].includes(el.type)))return;
  if(D.d!==undefined){S.d[D.d]=el.type==='checkbox'?el.checked:el.value;if(D.live)renderModal();return}
  if(D.ri!==undefined){S.d.rounds[+D.ri][D.rk]=el.value;return}
  if(D.q!==undefined){S.q[D.q]=el.type==='checkbox'?el.checked:el.value;render();return}
  if(D.m!==undefined){S.m[D.m]=el.type==='checkbox'?el.checked:el.value;renderModal()}
}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  let dirty=false;
  if((S.notif||S.userMenu)&&!e.target.closest('.pop')&&!(el&&(el.dataset.act==='notif'||el.dataset.act==='userMenu'))){S.notif=S.userMenu=false;renderBar()}
  if(S.gsq&&!e.target.closest('.gs')){S.gsq='';renderBar()}
  if(S.menu&&!e.target.closest('.menu-pop')&&!(el&&el.dataset.act==='kebab')){S.menu=null;dirty=true}
  if(el){const f=A[el.dataset.act];if(f){const inMenu=!!el.closest('.menu-pop')&&el.dataset.act!=='kebab';f(el.dataset,el,e);if(inMenu&&S.menu){S.menu=null;render()}return}}
  if(dirty)up();
});

/* charts */
function donut(parts){

function fitRows(){
  const w=document.querySelector('.dwrap');if(!w)return;
  w.style.gridTemplateRows='';
  if(innerWidth<1181)return;
  const cs=[...w.querySelectorAll('.s4.c3 .n3')];if(!cs.length)return;
  const keep0=cs.map(c=>[c.style.height,c.style.flex]);
  cs.forEach(c=>{c.style.height='auto';c.style.flex='none'});
  const h=Math.ceil(Math.max(...cs.map(c=>c.getBoundingClientRect().height)));
  cs.forEach((c,i)=>{c.style.height=keep0[i][0];c.style.flex=keep0[i][1]});
  if(h>0)w.style.gridTemplateRows=`${h}px ${h}px auto auto`;
}

/* tile map (state cartogram) */
function tileMap(year,sel,mini){
  const f=YF[year]||1,agg={};
  S.colleges.forEach(c=>{const a=agg[c.state]||(agg[c.state]={tot:0,att:0,rec:0,n:0});a.tot+=c.tot*f;a.att+=c.att*f;a.rec+=c.rec*f;a.n++});
  const mx=Math.max(...Object.values(agg).map(a=>a.att));
  const cells=[];for(let r=0;r<=6;r++)for(let c=0;c<9;c++)cells.push([c,r]);
  const at={};Object.entries(ST).forEach(([k,v])=>at[v[1]+','+v[2]]=k);
  return `<div class="tmap ${mini?'mini':''}" role="${mini?'img':'group'}" aria-label="NCET attempts by state">${cells.map(([c,r])=>{const k=at[c+','+r];if(!k)return '<span></span>';const a=agg[k];const p=a?Math.round(8+80*a.att/mx):0;
    const style=a?`background:color-mix(in srgb,var(--accent) ${p}%,var(--surface-2));color:${p>52?'var(--on-accent)':'var(--ink)'}`:'';
    const tip=`${ST[k][0]}${a?`: ${Math.round(a.att).toLocaleString('en-IN')} NCET attempts, ${a.n} college${a.n>1?'s':''}`:': no participating colleges'}`;
    return mini?`<span class="tile" style="${style}" title="${esc(tip)}">${k}</span>`:(a?`<button class="tile has ${sel===k?'sel':''}" style="${style}" title="${esc(tip)}" data-act="mapState" data-id="${k}">${k}</button>`:`<span class="tile" title="${esc(tip)}">${k}</span>`)}).join('')}</div>`;
}
