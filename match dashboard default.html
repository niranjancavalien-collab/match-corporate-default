    return `<div class="list">${P.length?P.map(p=>`<div class="card pad" style="box-shadow:none"><div style="display:flex;gap:10px;align-items:center">${av(p.who,30)}<div><b>${esc(p.t)}</b><div class="small muted">${esc(p.who)}</div></div></div><p style="margin:8px 0">${esc(p.m)}</p>${p.r.map(r=>`<div class="li" style="margin-bottom:6px;background:var(--surface-2);border:0"><div class="grow"><b>${esc(r.who)}</b>${esc(r.m)}</div></div>`).join('')}<div class="toolbar" style="flex-wrap:nowrap"><input id="f_rp_${p.id}" data-d="rp_${p.id}" value="${esc(S.d['rp_'+p.id]||'')}" placeholder="Write a reply"><button class="btn sm" data-act="reply" data-id="${p.id}" data-c="${c.id}">Reply</button></div></div>`).join(''):`<div class="empty"><b>No discussions yet</b><span>Start one to talk with your learners.</span></div>`}</div>
    <div class="form"><div class="span2 sub-h">New discussion</div>${F('dt','Title','text',{span:1,ph:'What would you like to discuss?'})}${F('dm','Message','textarea',{span:1})}<div class="span2"><button class="btn" data-act="postDisc" data-c="${c.id}">Post discussion</button></div></div>`}},{});
};
A.postDisc=d=>{if(!(S.d.dt||'').trim()){toast('Add a title');return}(S.disc[d.c]||(S.disc[d.c]=[])).unshift({id:nid('d'),who:'Cavalien',t:S.d.dt.trim(),m:S.d.dm||'',r:[]});S.d.dt='';S.d.dm='';toast('Discussion posted');renderModal()};
A.reply=d=>{const t=(S.d['rp_'+d.id]||'').trim();if(!t)return;by(S.disc[d.c],d.id).r.push({who:'Cavalien',m:t});S.d['rp_'+d.id]='';renderModal()};

/* ============ corporate mentorship ============ */
const usedIn=id=>S.courses.filter(c=>c.lib==='private'&&c.modules.includes(id)).length;
VIEWS.mentor=()=>{
  const tab=S.q.mtab||'courses';
  const acts=tab==='courses'?`<button class="btn" data-act="newCourse">${ic('plus',16)} Create course</button>`:tab==='modules'?`<button class="btn" data-act="newModule">${ic('plus',16)} Create module</button>`:'';
  return head('Corporate Mentorship Program','Your corporate learning system: build courses and modules, enrol learners, and track results.',acts)
   +`<div class="toolbar">${segs('mtab',[['courses','My Courses'],['modules','My Modules'],['analytics','My Analytics']],'courses')}</div>`
   +(tab==='courses'?mentorCourses():tab==='modules'?mentorModules():mentorAnalytics());
};
function mentorCourses(){
  const q=S.q.mcq||'',list=S.courses.filter(c=>c.lib==='private'&&cMatch(c,q));
  return `<div class="toolbar">${searchBox('mcq','Search your courses')}<span class="small muted">Same as your Private Skill Library in the Learning Marketplace.</span></div>`+(list.length?`<div class="g4">${list.map(courseCard).join('')}</div>`:empty('No matching courses','Clear the search or create a new course.'));
}
function mentorModules(){
  const q=(S.q.mmq||'').toLowerCase(),t=S.q.mtype||'All';
  const list=S.modules.filter(m=>(t==='All'||m.type===t)&&(!q||(m.title+m.tags.join(' ')).toLowerCase().includes(q)));
  return `<div class="toolbar">${searchBox('mmq','Search modules by title or skill')}<select id="q_mtype" data-q="mtype" aria-label="Module type">${['All','Learning','Assignment'].map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('')}</select></div>`
  +(list.length?`<div class="tw"><table><thead><tr><th>Module</th><th>Type</th><th>Format</th><th>Skill tags</th><th>Status</th><th>Used in</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${esc(m.title)}</b><div class="small muted">${esc(m.desc)}</div></td><td>${pill(m.type,m.type==='Learning'?'info':'')}</td><td>${esc(m.sub)}</td><td>${tags(m.tags)}</td><td>${m.status?pill(m.status,m.status==='Active'?'good':'bad'):'<span class="muted">—</span>'}</td><td class="tnum">${usedIn(m.id)} course${usedIn(m.id)===1?'':'s'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-act="editModule" data-id="${m.id}">Edit</button> ${m.sub==='MAPIT assessment'?`<button class="btn ghost sm" data-act="openMapit" data-id="${m.id}">Open ${ic('ext',13)}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('No modules found','Try another search or create a module.'));
}
A.openMapit=d=>{const m=by(S.modules,d.id);toast(`Opens "${m.title}" directly in MAPIT`)};
const SUBS={Learning:['Reading material','Video'],Assignment:['MCQ test','MAPIT assessment']};
A.newModule=()=>moduleModal(null);
A.editModule=d=>moduleModal(by(S.modules,d.id));
function moduleModal(m){
  openModal({title:m?'Edit module':'Create module',cta:m?'Save changes':'Create module',body:()=>`<div class="form">${F('title','Module title','text',{span:1})}
   ${F('type','Module type','select',{opts:['Learning','Assignment'],live:true})}${F('sub','Format','select',{opts:SUBS[S.d.type]||SUBS.Learning})}
   ${F('tags','Skill tags','text',{span:1,ph:'Java, REST',hint:'Used for learner recommendations. Shown next to the module in lists.'})}
   ${F('desc','Description','textarea',{span:1})}${F('content',S.d.type==='Assignment'?'Test link or question set':'Learning content (link or text)','textarea',{span:1,rows:2})}
   ${F('ref','Reference material','text',{span:1,ph:'Links or file names'})}</div>`,
   save:()=>{const D=S.d;if(!D.title.trim()){toast('Add a module title');return false}
    const sub=(SUBS[D.type]||[]).includes(D.sub)?D.sub:SUBS[D.type][0];
    const o={title:D.title.trim(),type:D.type,sub,tags:csv(D.tags),desc:D.desc,status:D.type==='Assignment'?(m?.status||'Active'):null};
    if(m)Object.assign(m,o);else S.modules.push({id:nid('m'),...o});toast(m?'Module updated':'Module created');render()}},
   {title:m?.title||'',type:m?.type||'Learning',sub:m?.sub||'Reading material',tags:(m?.tags||[]).join(', '),desc:m?.desc||'',content:'',ref:''});
}
/* analytics */
function anRows(){
  const cid=S.q.acourse||S.courses.find(c=>c.lib==='private').id,L=S.learners[cid]||[],q=(S.q.aq||'').toLowerCase();
  return L.filter(l=>(!S.q.afrom||l.enrolled>=S.q.afrom)&&(!S.q.ato||l.enrolled<=S.q.ato)&&((S.q.astat||'All')==='All'||l.status===S.q.astat)&&(!q||(l.name+l.email).toLowerCase().includes(q)));
}
function mentorAnalytics(){
  const priv=S.courses.filter(c=>c.lib==='private'),cid=S.q.acourse||priv[0].id,c=by(S.courses,cid),all=S.learners[cid]||[],rows=anRows(),perf=(S.q.atab||'perf')==='perf';
  const n=s=>all.filter(l=>l.status===s).length;
  return `<div class="toolbar"><select id="q_acourse" data-q="acourse" aria-label="Course" style="min-width:220px">${priv.map(p=>`<option value="${p.id}" ${p.id===cid?'selected':''}>${esc(p.title)}</option>`).join('')}</select>${segs('atab',[['enroll','Enrollment analytics'],['perf','Performance analytics']],'perf')}</div>
  <div class="kpis"><div class="card kpi"><span>Total enrollments</span><b>${all.length}</b></div><div class="card kpi"><span>Completed</span><b>${n('Completed')}</b><small>${all.length?Math.round(100*n('Completed')/all.length):0}% completion rate</small></div><div class="card kpi"><span>In progress</span><b>${n('In progress')}</b></div><div class="card kpi"><span>Not started</span><b>${n('Not started')}</b></div></div>
  <div class="toolbar"><label class="small muted" for="q_afrom">Enrolled from</label><input id="q_afrom" type="date" data-q="afrom" value="${S.q.afrom||''}" style="width:auto"><label class="small muted" for="q_ato">to</label><input id="q_ato" type="date" data-q="ato" value="${S.q.ato||''}" style="width:auto">
   ${perf?`<select id="q_astat" data-q="astat" aria-label="Completion status" style="width:auto">${['All','Completed','In progress','Not started'].map(x=>`<option ${x===(S.q.astat||'All')?'selected':''}>${x}</option>`).join('')}</select>${searchBox('aq','Search learner by name or email')}`:''}
   <span class="sp"></span><button class="btn ghost sm" data-act="copyCsv" ${rows.length?'':'disabled'}>${ic('copy',14)} Copy as CSV</button></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Learner</th><th>Enrolled on</th>${perf?'<th>Status</th><th>Progress</th><th>Score</th>':'<th>Email</th>'}</tr></thead><tbody>${rows.map(l=>`<tr><td><div style="display:flex;gap:10px;align-items:center">${av(l.name,30)}<div><b>${esc(l.name)}</b>${perf?`<div class="small muted">${esc(l.email)}</div>`:''}</div></div></td><td class="tnum">${fd(l.enrolled)}</td>${perf?`<td>${pill(l.status,l.status==='Completed'?'good':l.status==='In progress'?'warn':'')}</td><td style="min-width:130px"><div class="prog"><i style="width:${l.progress}%"></i></div></td><td class="tnum">${l.score==null?'—':l.score+'%'}</td>`:`<td>${esc(l.email)}</td>`}</tr>`).join('')}</tbody></table></div>`
  :empty(all.length?'No learners match these filters':'No enrollments yet',all.length?'Widen the date range or clear the filters.':`Send invites for "${esc(c.title)}" to see analytics.`,all.length?`<button class="btn ghost sm" data-act="clearAn">Clear filters</button>`:`<button class="btn sm" data-act="invite" data-id="${cid}">Send invites</button>`)}
  <p class="small muted">Downloads are not available inside this page, so use Copy as CSV and paste into Excel or Sheets.</p>`;
}
A.clearAn=()=>{['afrom','ato','aq'].forEach(k=>S.q[k]='');S.q.astat='All';render()};
A.copyCsv=()=>{const r=anRows(),h='Name,Email,Enrolled on,Status,Progress %,Score %';copy([h,...r.map(l=>[l.name,l.email,l.enrolled,l.status,l.progress,l.score??''].join(','))].join('\n'),'Analytics copied as CSV')};
</script>
<script>
/* ============ premium candidates ============ */
S.sel=[];S.nsel=[];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fm=s=>{const [y,m]=s.split('-');return MON[+m-1]+' '+y};
const catKind=c=>c==='Deployment Ready'?'good':c==='Employment Ready'?'info':'warn';
function candList(){
  const q=(S.q.pq||'').toLowerCase(),role=S.q.prole||'All',sk=S.q.pskill||'All',eq=+(S.q.peq||0),ce=S.q.pcert||'',cat=S.q.pcat||'All';
  return S.cands.filter(c=>(!q||c.name.toLowerCase().includes(q))&&(role==='All'||c.role===role)&&(sk==='All'||c.skills.includes(sk))&&c.eq>=eq&&(!ce||c.cert===ce)&&(cat==='All'||c.cat===cat));
}
VIEWS.premium=()=>{
  const roles=[...new Set(S.cands.map(c=>c.role))],sk=[...new Set(S.cands.flatMap(c=>c.skills))].sort(),L=candList();
  const opt=(a,cur)=>['All',...a].map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');
  return head('Premium Candidates','A curated pool of verified candidates from NCET Plus (MEET, MCAT, MSET and the Capstone project).','')
  +`<div class="toolbar">${segs('pcat',[['All','All'],['Deployment Ready','Deployment Ready'],['Employment Ready','Employment Ready'],['Highly Deployable','Highly Deployable']],'All')}</div>
  <div class="toolbar">${searchBox('pq','Search candidates by name')}
   <select id="q_prole" data-q="prole" aria-label="Role">${opt(roles,S.q.prole||'All').replace('<option >All','<option>All')}</select>
   <select id="q_pskill" data-q="pskill" aria-label="Skill">${opt(sk,S.q.pskill||'All')}</select>
   <label class="small muted" style="display:flex;gap:8px;align-items:center" for="q_peq">EQ score ≥ <b class="tnum" style="color:var(--ink)">${S.q.peq||0}</b><input id="q_peq" type="range" min="0" max="95" step="5" data-q="peq" value="${S.q.peq||0}" style="width:110px"></label>
   <label class="small muted" style="display:flex;gap:8px;align-items:center" for="q_pcert">Certified in <input id="q_pcert" type="month" data-q="pcert" value="${S.q.pcert||''}" style="width:auto;border-radius:999px"></label>
   ${(S.q.pq||S.q.pcert||S.q.peq>0||(S.q.prole&&S.q.prole!=='All')||(S.q.pskill&&S.q.pskill!=='All')||(S.q.pcat&&S.q.pcat!=='All'))?`<button class="btn ghost sm" data-act="clearP">Clear</button>`:''}</div>
  <div class="small muted">${L.length} of ${S.cands.length} candidates</div>
  ${L.length?`<div class="g3">${L.map(c=>{const on=S.sel.includes(c.id);return `<article class="card cand ${on?'sel':''}"><div class="top"><label class="chk" title="Select candidate"><input type="checkbox" data-act="selCand" data-id="${c.id}" ${on?'checked':''} aria-label="Select ${esc(c.name)}"></label>${av(c.name,40)}<div style="min-width:0"><button class="nm" data-act="cand" data-id="${c.id}">${esc(c.name)}</button><div class="small muted">${esc(c.role)}</div></div><div class="eq"><b class="tnum">${c.eq}</b><span>EQ SCORE</span></div></div>
   <div class="small muted">${esc(c.college)}</div><div>${pill(c.cat,catKind(c.cat))}</div>${tags(c.skills)}
   <div style="display:flex;justify-content:space-between;align-items:center"><span class="small muted">Certified ${fm(c.cert)}</span><span><button class="btn ghost sm" data-act="cand" data-id="${c.id}" data-tab="report">NCET Plus report</button></span></div></article>`}).join('')}</div>`
  :empty('No candidates match','Loosen the EQ score or clear a filter.',`<button class="btn ghost sm" data-act="clearP">Clear filters</button>`)}
  ${S.sel.length?`<div class="selbar"><b>${S.sel.length} selected</b><button class="btn sm" data-act="hireEvent">Create hiring event</button><button class="btn ghost sm" data-act="clearSel">Clear</button></div>`:''}`;
};
A.clearP=()=>{['pq','pcert'].forEach(k=>S.q[k]='');S.q.peq=0;S.q.prole='All';S.q.pskill='All';S.q.pcat='All';render()};
A.selCand=d=>{const i=S.sel.indexOf(d.id);i<0?S.sel.push(d.id):S.sel.splice(i,1);up()};
A.clearSel=()=>{S.sel=[];up()};
A.hireEvent=()=>{const cs=S.sel.map(id=>by(S.cands,id));eventModal({cands:cs.map(c=>c.name),role:cs[0].role})};
A.cand=d=>{
  const c=by(S.cands,d.id);
  openModal({title:()=>esc(c.name),wide:true,foot:()=>`<button class="btn ghost" data-act="copyReport" data-id="${c.id}">${ic('copy',16)} Copy report</button><button class="btn" data-act="${S.sel.includes(c.id)?'closeModal':'selFromModal'}" data-id="${c.id}">${S.sel.includes(c.id)?'Selected':'Select candidate'}</button>`,body:()=>{
    const hd=`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${av(c.name,56)}<div style="flex:1;min-width:200px"><div class="sub-h" style="font-size:18px">${esc(c.name)}</div><div class="muted">${esc(c.role)} · ${esc(c.college)}</div><div style="margin-top:6px">${pill(c.cat,catKind(c.cat))}</div></div><div class="eq"><b class="tnum" style="font-size:34px">${c.eq}</b><span>EQ SCORE</span></div></div>`;
    const tab=S.m.tab||'profile';
    const pct=!!S.m.pct;
    const sc=[['MEET',c.meet],['MCAT',c.mcat],['MSET',c.mset],['Capstone project',c.cap]];
    return hd+`<div class="seg"><button class="${tab==='profile'?'on':''}" data-act="setm" data-k="tab" data-v="profile">Profile</button><button class="${tab==='report'?'on':''}" data-act="setm" data-k="tab" data-v="report">NCET Plus report</button></div>`
    +(tab==='profile'?`<div class="kv"><div><span>College</span><b>${esc(c.college)}</b></div><div><span>Target role</span><b>${esc(c.role)}</b></div><div><span>Certified</span><b>${fm(c.cert)}</b></div></div>
      <div><div class="sub-h">Summary</div><p>${esc(c.name.split(' ')[0])} is a ${esc(c.role.toLowerCase())} candidate verified through NCET Plus with an Employability Quotient of ${c.eq}. ${esc(c.feedback)}</p></div>
      <div><div class="sub-h" style="margin-bottom:6px">Skills</div>${tags(c.skills)}</div><div><div class="sub-h">Capstone project</div><p>${esc(c.project)}: designed, built and presented as part of NCET Plus.</p></div>`
    :`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="sub-h">Assessment scores</div><div class="seg"><button class="${!pct?'on':''}" data-act="setm" data-k="pct" data-v="">Raw score</button><button class="${pct?'on':''}" data-act="setm" data-k="pct" data-v="1">Percentage</button></div></div>
      <div class="list">${sc.map(([n,[v,m]])=>{const p=Math.round(100*v/m);return `<div class="li" style="display:grid;grid-template-columns:130px 1fr 80px;gap:12px"><b>${n}</b><div class="prog" style="height:10px"><i style="width:${p}%"></i></div><b class="tnum" style="text-align:right">${pct?p+'%':v+' / '+m}</b></div>`}).join('')}</div>
      <div class="kv"><div><span>Candidate</span><b>${esc(c.name)}</b></div><div><span>College</span><b>${esc(c.college)}</b></div><div><span>Certification date</span><b>${fm(c.cert)}</b></div></div>
      <div><div class="sub-h" style="margin-bottom:6px">Skills assessed</div>${tags(c.skills)}</div><div><div class="sub-h">Expert feedback</div><p>${esc(c.feedback)}</p></div>`);
  }},{},{tab:d.tab||'profile',pct:''});
};
A.selFromModal=d=>{if(!S.sel.includes(d.id))S.sel.push(d.id);toast('Candidate selected');up()};
A.copyReport=d=>{const c=by(S.cands,d.id);copy(`NCET Plus report: ${c.name} (${c.college})\nRole: ${c.role} | EQ ${c.eq} | ${c.cat} | Certified ${fm(c.cert)}\nMEET ${c.meet[0]}/${c.meet[1]}, MCAT ${c.mcat[0]}/100, MSET ${c.mset[0]}/100, Capstone ${c.cap[0]}/100\nFeedback: ${c.feedback}`,'Report copied')};

/* ============ campaigns ============ */
const campTone=['t-lav','t-rose','t-mint','t-sand','t-orchid'];
VIEWS.campaigns=()=>{
  const st=S.q.cstat||'all',q=(S.q.cq||'').toLowerCase(),a=S.campaigns.filter(c=>c.active).length;
  const L=S.campaigns.filter(c=>(st==='all'||(st==='active')===c.active)&&(!q||(c.title+c.desc).toLowerCase().includes(q)));
  return head('Campaigns',`${S.campaigns.length} campaigns · ${a} active · ${S.campaigns.length-a} inactive`,`<button class="btn" data-act="newCamp">${ic('plus',16)} Create campaign</button>`)
  +`<div class="toolbar">${segs('cstat',[['all','All',S.campaigns.length],['active','Active',a],['inactive','Inactive',S.campaigns.length-a]],'all')}${searchBox('cq','Search campaigns')}</div>`
  +(L.length?`<div class="g3">${L.map(c=>`<article class="card" style="overflow:hidden;display:flex;flex-direction:column"><div class="${c.img}" style="padding:18px;min-height:96px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px"><h3 style="font-size:17px">${esc(c.title)}</h3></div>
   <div class="pad" style="display:flex;flex-direction:column;gap:10px;flex:1"><div style="display:flex;justify-content:space-between;align-items:center">${pill(c.active?'Active':'Inactive',c.active?'good':'')}<span class="small muted">Created ${fd(c.created)}</span></div><p class="muted small">${esc(c.desc)}</p>
   <div class="small tnum muted">${c.stats.views.toLocaleString('en-IN')} views · ${c.stats.clicks.toLocaleString('en-IN')} clicks · ${c.stats.shares} shares</div>
   <div class="cacts"><button class="btn ghost sm" data-act="campDetail" data-id="${c.id}">Details</button><button class="btn ghost sm" data-act="campStats" data-id="${c.id}">Analytics</button><button class="btn sm" data-act="share" data-id="${c.id}">${ic('share',14)} Share</button></div>
   <div class="cacts" style="padding-top:0"><button class="iconbtn" title="Edit" aria-label="Edit campaign" data-act="editCamp" data-id="${c.id}">${ic('edit')}</button><button class="iconbtn" title="Clone" aria-label="Clone campaign" data-act="cloneCamp" data-id="${c.id}">${ic('clone')}</button><button class="btn ghost sm" style="flex:1" data-act="toggleCamp" data-id="${c.id}">${ic('power',14)} ${c.active?'Deactivate':'Activate'}</button></div></div></article>`).join('')}</div>`:empty('No campaigns found','Change the filter or create a new campaign.'));
};
A.toggleCamp=d=>{const c=by(S.campaigns,d.id);c.active=!c.active;toast(`Campaign ${c.active?'activated':'deactivated'}`);render()};
A.cloneCamp=d=>{const c=by(S.campaigns,d.id);S.campaigns.unshift({...c,id:nid('g'),title:c.title+' (copy)',active:false,created:iso(0),stats:{views:0,clicks:0,shares:0}});toast('Campaign cloned as inactive');render()};
A.newCamp=()=>campModal(null);A.editCamp=d=>campModal(by(S.campaigns,d.id));
function campModal(c){
  openModal({title:c?'Edit campaign':'Create campaign',cta:c?'Save changes':'Create campaign',body:()=>`<div class="form">${F('title','Campaign title','text',{span:1})}${F('desc','Description','textarea',{span:1})}${F('img','Campaign image','select',{opts:[['t-lav','Lavender'],['t-rose','Rose'],['t-mint','Mint'],['t-sand','Sand'],['t-orchid','Orchid']],live:true})}${F('url','Redirection URL','url',{ph:'https://'})}<div class="span2"><div class="${S.d.img}" style="border-radius:12px;padding:14px"><b>${esc(S.d.title||'Preview')}</b></div></div>${F('active','Publish as active','check',{span:1})}</div>`,
  save:()=>{const D=S.d;if(!D.title.trim()){toast('Add a campaign title');return false}if(D.url&&!/^https?:\/\//.test(D.url)){toast('Redirection URL must start with http:// or https://');return false}
   if(c)Object.assign(c,{title:D.title.trim(),desc:D.desc,img:D.img,url:D.url,active:D.active});else S.campaigns.unshift({id:nid('g'),title:D.title.trim(),desc:D.desc,img:D.img,url:D.url,active:D.active,created:iso(0),stats:{views:0,clicks:0,shares:0}});toast(c?'Campaign updated':'Campaign created');render()}},
  {title:c?.title||'',desc:c?.desc||'',img:c?.img||'t-lav',url:c?.url||'',active:c?c.active:true});
}
A.campDetail=d=>{const c=by(S.campaigns,d.id);openModal({title:()=>esc(c.title),foot:()=>`<button class="btn ghost" data-act="editCamp" data-id="${c.id}">Edit</button><button class="btn" data-act="share" data-id="${c.id}">Share</button>`,body:()=>`<div class="${c.img}" style="border-radius:14px;padding:22px"><h3>${esc(c.title)}</h3></div><div class="kv"><div><span>Status</span><b>${c.active?'Active':'Inactive'}</b></div><div><span>Created</span><b>${fd(c.created)}</b></div><div><span>Redirects to</span><b style="word-break:break-all">${esc(c.url||'Not set')}</b></div></div><p>${esc(c.desc)}</p>`})};
A.campStats=d=>{const c=by(S.campaigns,d.id),s=c.stats,ctr=s.views?(100*s.clicks/s.views).toFixed(1):'0.0';
  openModal({title:()=>`Analytics · ${esc(c.title)}`,foot:`<button class="btn ghost" data-act="closeModal">Close</button>`,body:()=>`<div class="stat"><div><b>${s.views.toLocaleString('en-IN')}</b><span>Views</span></div><div><b>${s.clicks.toLocaleString('en-IN')}</b><span>Clicks</span></div><div><b>${ctr}%</b><span>Click-through</span></div></div><div class="small muted">${s.shares} shares across channels.</div>`})};
const CH=[['match','MATCH Network','Corporate and college accounts on MATCH'],['email','Public network (email)','Send to any email address'],['linkedin','LinkedIn',''],['facebook','Facebook',''],['whatsapp','WhatsApp','']];
A.share=d=>{const c=by(S.campaigns,d.id);openModal({title:()=>`Share · ${esc(c.title)}`,cta:'Share campaign',body:()=>`<div class="list">${CH.map(([k,l,s])=>`<label class="li" for="f_ch_${k}"><input type="checkbox" id="f_ch_${k}" data-d="ch_${k}" data-live="1" ${S.d['ch_'+k]?'checked':''}><div class="grow"><b>${l}</b>${s?`<span class="small muted">${s}</span>`:''}</div></label>`).join('')}</div>${S.d.ch_email?`<div class="form">${F('emails','Recipient emails','textarea',{span:1,rows:2,ph:'name@example.com, other@example.com'})}</div>`:''}
  <div class="li"><div class="grow small" style="word-break:break-all">${esc(c.url||'https://match.myanatomy.example/c/'+c.id)}</div><button class="btn ghost sm" data-act="copyText" data-v="${esc(c.url||'https://match.myanatomy.example/c/'+c.id)}">${ic('copy',14)} Copy link</button></div>`,
  save:()=>{const k=CH.filter(([k])=>S.d['ch_'+k]);if(!k.length){toast('Pick at least one channel');return false}if(S.d.ch_email){const l=parseEmails(S.d.emails||'');if(!l.length||!l.every(emailOk)){toast('Enter valid email addresses for the email channel');return false}}
   c.stats.shares+=k.length;toast(`Shared via ${k.map(x=>x[1]).join(', ')}`);render()}},{})};

/* ============ events ============ */
VIEWS.events=()=>{
  const ev=evCounts(),tab=S.q.etab||'current',q=(S.q.eq||'').toLowerCase();
  const L=S.events.filter(e=>evStatus(e)===tab&&(!q||(e.title+e.role).toLowerCase().includes(q)));
  return head('Campus Events','Plan campus drives, invite colleges, verify participation and track every round.',`<button class="btn" data-act="newEvent">${ic('plus',16)} Create event</button>`)
  +`<div class="toolbar">${segs('etab',[['current','Current events',ev.current],['upcoming','Upcoming events',ev.upcoming],['completed','Completed events',ev.completed]],'current')}${searchBox('eq','Search events')}<span class="sp"></span>${segs('evw',[['table','Table'],['cards','Cards']],'table')}</div>`
  +(L.length&&(S.q.evw||'table')==='table'?evTable(L):L.length?`<div class="g3">${L.map(e=>{const acc=e.colleges.filter(c=>c[1]==='Accepted').length;return `<article class="card pad" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3 style="font-size:17px">${esc(e.title)}</h3>${pill(e.type==='Hiring event'?'Hiring event':'Campus drive','info')}</div><div class="muted small">${esc(e.role)}</div>
   <div class="kv" style="grid-template-columns:1fr 1fr"><div><span>Event dates</span><b class="tnum">${fd(e.start)} → ${fd(e.end)}</b></div><div><span>Registration</span><b class="tnum">${fd(e.regStart)} → ${fd(e.regEnd)}</b></div><div><span>Colleges</span><b>${acc} of ${e.colleges.length} accepted</b></div><div><span>Registered</span><b>${e.regs.length}</b></div></div>
   <div class="cacts"><button class="btn sm" data-act="evDetail" data-id="${e.id}">View details</button><button class="btn ghost sm" data-act="soon" data-msg="Opens interview management in MAPIT">Manage interview ${ic('ext',13)}</button></div></article>`}).join('')}</div>`:empty(`No ${tab==='current'?'current':tab} events`,'Create an event to start inviting colleges.',`<button class="btn sm" data-act="newEvent">Create event</button>`));
};
const respKind=r=>r==='Accepted'?'good':r==='Rejected'?'bad':'warn';
A.evDetail=d=>{
  const e=by(S.events,d.id);
  openModal({title:()=>esc(e.title),wide:true,foot:()=>`<button class="btn ghost" data-act="soon" data-msg="Opens interview management in MAPIT">Manage interview ${ic('ext',14)}</button><button class="btn ghost" data-act="closeModal">Close</button>`,body:()=>{
   const tab=S.m.tab||'overview',st=evStatus(e),acc=e.colleges.filter(c=>c[1]==='Accepted').length;
   const T=[['overview','Overview'],['colleges','Colleges'],['regs','Registrations'],['flow','Process & rounds'],['ann','Announcements']];
   const head=`<div class="seg">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="setm" data-k="tab" data-v="${k}">${l}</button>`).join('')}</div>`;
   if(tab==='overview')return head+`<div class="kv"><div><span>Status</span><b>${st==='current'?'Live now':st==='upcoming'?'Upcoming':'Completed'}</b></div><div><span>Job role</span><b>${esc(e.role)}</b></div><div><span>Event dates</span><b>${fd(e.start)} to ${fd(e.end)}</b></div><div><span>Registration dates</span><b>${fd(e.regStart)} to ${fd(e.regEnd)}</b></div><div><span>Colleges accepted</span><b>${acc} of ${e.colleges.length}</b></div><div><span>Registrations</span><b>${e.regs.length} (${e.regs.filter(r=>r.verified).length} verified)</b></div></div>${e.info?`<p>${esc(e.info)}</p>`:''}${e.cands?.length?`<div><div class="sub-h" style="margin-bottom:6px">Invited premium candidates</div>${tags(e.cands)}</div>`:''}`;
   if(tab==='colleges'){const left=S.colleges.filter(c=>!e.colleges.some(x=>x[0]===c.id));return head+`<div class="tags">${['Accepted','Not Seen','Rejected'].map(r=>pill(`${r}: ${e.colleges.filter(c=>c[1]===r).length}`,respKind(r))).join('')}</div><div class="list">${e.colleges.length?e.colleges.map(([id,r])=>{const c=by(S.colleges,id);return `<div class="li"><div class="grow"><b>${esc(c.name)}</b><span class="small muted">${esc(c.city)}, ${ST[c.state][0]} · ${c.stream}</span></div>${pill(r,respKind(r))}</div>`}).join(''):'<div class="small muted">No colleges invited yet.</div>'}</div>${st!=='completed'?`<div class="toolbar"><div style="flex:1;min-width:220px">${F('addCol','','select',{opts:[['','Invite another college…'],...left.map(c=>[c.id,c.name])]})}</div><button class="btn ghost sm" data-act="addCol" data-id="${e.id}">Invite</button></div>`:''}`}
   if(tab==='regs')return head+(e.regs.length?`<div class="toolbar"><span class="small muted">${e.regs.filter(r=>r.verified).length} of ${e.regs.length} verified</span><span class="sp"></span><button class="btn ghost sm" data-act="verifyAll" data-id="${e.id}">Verify all</button><button class="btn sm" data-act="admit" data-id="${e.id}">Generate admit cards</button></div><div class="list">${e.regs.map((r,i)=>`<div class="li">${av(r.name,30)}<div class="grow"><b>${esc(r.name)}</b><span class="small muted">${esc(r.college)}</span></div>${pill(r.verified?'Verified':'Pending',r.verified?'good':'warn')}${r.verified?'':`<button class="btn ghost sm" data-act="verifyOne" data-id="${e.id}" data-i="${i}">Verify</button>`}</div>`).join('')}</div>`:empty('No registrations yet',st==='upcoming'?`Registration opens on ${fd(e.regStart)}.`:'Nobody registered for this event.'));
   if(tab==='flow')return head+`<div class="list">${e.rounds.map((r,i)=>`<div class="li"><span class="av" style="width:28px;height:28px;background:var(--surface-2);color:var(--ink-2)">${i+1}</span><div class="grow"><b>${esc(r.name)}</b></div>${pill(r.assess,'info')}</div>`).join('')||'<div class="small muted">No rounds configured.</div>'}</div>${st!=='completed'?`<div class="toolbar"><div style="flex:1;min-width:160px">${F('rn','','text',{ph:'Round name'})}</div><div style="min-width:180px">${F('ra','','select',{opts:ASSESS})}</div><button class="btn ghost sm" data-act="addRound" data-id="${e.id}">Add round</button></div>`:''}`;
   return head+`<div class="list">${e.ann.length?e.ann.map(a=>`<div class="li" style="align-items:flex-start"><div class="grow"><b>${esc(a.t)}</b><span class="small muted">${fd(a.d)}</span><div>${esc(a.m)}</div></div></div>`).join(''):'<div class="small muted">No announcements yet.</div>'}</div><div class="form">${F('at','Announcement title','text',{span:1})}${F('am','Message','textarea',{span:1,rows:2})}<div class="span2"><button class="btn" data-act="postAnn" data-id="${e.id}">Publish announcement</button></div></div>`;
  }},{rn:'',ra:ASSESS[0],at:'',am:'',addCol:''},{tab:'overview'});
};
const ASSESS=['MAPIT Aptitude','MAPIT Coding','AI Interview','Technical Interview','HR Interview','Group discussion'];
A.addCol=d=>{if(!S.d.addCol)return;by(S.events,d.id).colleges.push([S.d.addCol,'Not Seen']);S.d.addCol='';toast('Invitation sent');up()};
A.verifyOne=d=>{by(S.events,d.id).regs[+d.i].verified=true;up()};
A.verifyAll=d=>{by(S.events,d.id).regs.forEach(r=>r.verified=true);toast('All participation verified');up()};
A.admit=d=>{const n=by(S.events,d.id).regs.filter(r=>r.verified).length;toast(n?`${n} admit card${n>1?'s':''} generated`:'Verify participants first')};
A.addRound=d=>{if(!S.d.rn.trim()){toast('Name the round');return}by(S.events,d.id).rounds.push({name:S.d.rn.trim(),assess:S.d.ra});S.d.rn='';renderModal()};
A.postAnn=d=>{if(!S.d.at.trim()){toast('Add a title');return}by(S.events,d.id).ann.unshift({t:S.d.at.trim(),m:S.d.am,d:iso(0)});S.d.at='';S.d.am='';toast('Announcement published');renderModal()};
A.newEvent=()=>eventModal({});
function eventModal(o){
  const roles=S.jobs.map(j=>j.title);
  openModal({title:'Create campus event',wide:true,cta:'Create event',body:()=>{
    const D=S.d,f=(D.cf_q||'').toLowerCase();
    const cl=S.colleges.filter(c=>(!f||(c.name+c.city).toLowerCase().includes(f))&&(!D.cf_state||D.cf_state==='All'||c.state===D.cf_state)&&(!D.cf_stream||D.cf_stream==='All'||c.stream===D.cf_stream)&&c.ncet>=(+D.cf_ncet||0)&&c.grad>=(+D.cf_grad||0));
    const streams=[...new Set(S.colleges.map(c=>c.stream))],states=[...new Set(S.colleges.map(c=>c.state))];
    return `<div class="form">${F('title','Event title','text',{span:1,ph:'e.g. Southern Campus Drive 2027'})}
    ${F('role','Job role','select',{opts:[...roles,['__new','+ Create a new role']],live:true})}${D.role==='__new'?F('newRole','New role name','text',{ph:'e.g. Product Analyst'}):`<div class="field"><label>&nbsp;</label><span class="small muted">Select an existing role or create one.</span></div>`}
    ${F('start','Event start','date')}${F('end','Event end','date')}${F('regStart','Registration opens','date')}${F('regEnd','Registration closes','date')}</div>
    ${D.cands?.length?`<div><div class="sub-h" style="margin-bottom:6px">Premium candidates for this event</div>${tags(D.cands)}</div>`:''}
    <div><div class="sub-h" style="margin-bottom:8px">Invite colleges <span class="muted small">(${D.colleges.length} selected)</span></div>
     <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${F('cf_q','Search','search',{ph:'College or city',live:true})}${F('cf_state','State','select',{opts:['All',...states.map(s=>[s,ST[s][0]])],live:true})}${F('cf_stream','Stream','select',{opts:['All',...streams],live:true})}${F('cf_ncet','NCET % at least','number',{min:0,max:100,live:true})}${F('cf_grad','Graduation % at least','number',{min:0,max:100,live:true})}</div>
     <div class="list sc" style="max-height:230px;overflow:auto;margin-top:8px">${cl.length?cl.map(c=>`<label class="li" for="cc_${c.id}"><input type="checkbox" id="cc_${c.id}" data-act="togCol" data-id="${c.id}" ${D.colleges.includes(c.id)?'checked':''}><div class="grow"><b>${esc(c.name)}</b><span class="small muted">${esc(c.city)}, ${ST[c.state][0]} · ${c.stream} (${c.degree})</span></div><span class="small tnum muted">Grad ${c.grad}% · NCET ${c.ncet}%</span></label>`).join(''):'<div class="small muted">No colleges match these filters.</div>'}</div></div>
    <div><div class="sub-h" style="margin-bottom:8px">Recruitment rounds</div><div class="list">${D.rounds.map((r,i)=>`<div class="li"><span class="av" style="width:26px;height:26px;background:var(--surface-2);color:var(--ink-2)">${i+1}</span><input aria-label="Round name" data-ri="${i}" data-rk="name" value="${esc(r.name)}" placeholder="Round name"><select aria-label="Assessment" data-ri="${i}" data-rk="assess" style="max-width:200px">${ASSESS.map(a=>`<option ${a===r.assess?'selected':''}>${a}</option>`).join('')}</select><button class="iconbtn" aria-label="Remove round" data-act="rmRound" data-i="${i}">${ic('x',16)}</button></div>`).join('')}</div><button class="btn ghost sm" style="margin-top:8px" data-act="newRound">${ic('plus',14)} Add round</button></div>
    <div class="form">${F('info','Additional event information','textarea',{span:1,rows:2})}</div>`},
  save:()=>{const D=S.d;const role=D.role==='__new'?(D.newRole||'').trim():D.role;
   if(!D.title.trim()||!role){toast('Add an event title and a job role');return false}
   if(!D.start||!D.end||!D.regStart||!D.regEnd){toast('Fill in all four dates');return false}
   if(D.start>D.end||D.regStart>D.regEnd||D.regEnd>D.end){toast('Check the dates: registration must close before the event ends');return false}
   if(!D.colleges.length){toast('Invite at least one college');return false}
   const e={id:nid('e'),title:D.title.trim(),role,type:D.cands?.length?'Hiring event':'Campus drive',start:D.start,end:D.end,regStart:D.regStart,regEnd:D.regEnd,info:D.info,colleges:D.colleges.map(id=>[id,'Not Seen']),regs:[],rounds:D.rounds.filter(r=>r.name.trim()).map(r=>({...r})),ann:[],cands:D.cands||[]};
   e.status=evStatus(e);S.events.unshift(e);const j=S.jobs.find(x=>x.title===role);S.reqs.unshift({id:nid('q'),title:e.title,job:j?j.id:null,role,status:'Pending',raised:iso(0),colleges:[],color:campTone[S.reqs.length%5]});
   S.q.etab=e.status;toast('Event created and sent as an event request');go('events')}},
  {title:'',role:o.role||roles[0],newRole:'',start:iso(14),end:iso(18),regStart:iso(2),regEnd:iso(12),info:'',colleges:[...(o.colleges||[])],rounds:[{name:'Online assessment',assess:'MAPIT Aptitude'},{name:'Technical interview',assess:'Technical Interview'}],cands:o.cands||[],cf_q:'',cf_state:'All',cf_stream:'All',cf_ncet:'',cf_grad:''});
}
A.togCol=d=>{const a=S.d.colleges,i=a.indexOf(d.id);i<0?a.push(d.id):a.splice(i,1);renderModal()};
A.newRound=()=>{S.d.rounds.push({name:'',assess:ASSESS[0]});renderModal()};
A.rmRound=d=>{S.d.rounds.splice(+d.i,1);renderModal()};
</script>
<script>
/* ============ hackathons ============ */
S.hacks.forEach(h=>{h.pub=h.status!=='Unpublished';h.hue=hue(h.title)%5});
const hkStatus=h=>!h.pub?'Unpublished':h.start>iso(0)?'Upcoming':h.end<iso(0)?'Expired':'Live';
const hkKind=s=>s==='Live'?'good':s==='Upcoming'?'info':s==='Expired'?'':'warn';
VIEWS.hacks=()=>{
  const st=S.q.hstat||'All',q=(S.q.hq||'').toLowerCase(),n=s=>S.hacks.filter(h=>hkStatus(h)===s).length;
  const L=S.hacks.filter(h=>(st==='All'||hkStatus(h)===st)&&(!q||h.title.toLowerCase().includes(q)));
  return head('My Hackathons','Create, run and wrap up industry-focused hackathons without leaving MATCH.',`<button class="btn" data-act="newHack">${ic('plus',16)} Create hackathon</button>`)
  +`<div class="toolbar">${segs('hstat',[['All','All',S.hacks.length],['Live','Live',n('Live')],['Upcoming','Upcoming',n('Upcoming')],['Expired','Expired',n('Expired')],['Unpublished','Unpublished',n('Unpublished')]],'All')}${searchBox('hq','Search hackathons by name')}</div>`
  +(L.length?`<div class="g3">${L.map(h=>{const s=hkStatus(h),canEdit=s==='Upcoming'||s==='Unpublished';return `<article class="card" style="overflow:hidden;display:flex;flex-direction:column">${banner(h.hue)}<div class="pad" style="display:flex;flex-direction:column;gap:10px;flex:1"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3 style="font-size:17px">${esc(h.title)}</h3>${pill(s,hkKind(s))}</div>
   <div class="tags">${pill(h.vis)}${pill(h.mode)}</div><p class="small muted">${esc(h.desc)}</p><div class="small tnum muted">${fd(h.start)} → ${fd(h.end)} · ${h.regs.length}${h.limit?' / '+h.limit:''} registered</div>
   <div class="cacts"><button class="btn sm" data-act="manageHack" data-id="${h.id}">Manage</button><button class="btn ghost sm" data-act="previewHack" data-id="${h.id}">Preview</button>${canEdit?`<button class="btn ghost sm" data-act="editHack" data-id="${h.id}">Edit</button>`:''}</div>
   <div class="cacts" style="padding-top:0"><button class="btn ghost sm" data-act="cloneHack" data-id="${h.id}">${ic('clone',14)} Clone</button><button class="btn ghost sm" data-act="pubHack" data-id="${h.id}">${h.pub?'Unpublish':'Publish'}</button></div></div></article>`}).join('')}</div>`:empty('No hackathons found','Change the status filter or create a new hackathon.'));
};
A.pubHack=d=>{const h=by(S.hacks,d.id);h.pub=!h.pub;toast(h.pub?'Hackathon published':'Hackathon unpublished');render()};
A.cloneHack=d=>{const h=by(S.hacks,d.id);S.hacks.unshift({...h,id:nid('h'),title:h.title+' (copy)',pub:false,regs:[],ann:[],start:iso(30),end:iso(32),regStart:iso(10),regEnd:iso(28)});toast('Cloned as an unpublished draft');render()};
A.newHack=()=>hackModal(null);A.editHack=d=>hackModal(by(S.hacks,d.id));
function hackModal(h){
  openModal({title:h?'Edit hackathon':'Create hackathon',wide:true,cta:h?'Save changes':'Create hackathon',body:()=>`<div class="form">${F('title','Hackathon name','text',{span:1})}${F('vis','Visibility','select',{opts:['Public','Invite Only']})}${F('mode','Event mode','select',{opts:['Online','Offline']})}
   ${F('desc','Description','textarea',{span:1})}${F('url','Organisation website URL','url',{ph:'https://'})}${F('aud','Target audience','text')}${F('limit','Registration limit','number',{min:1})}${F('skills','Required skills','text',{ph:'React, Python'})}
   ${F('poc','Point of contact','text',{span:1,ph:'Name and email'})}${F('hue','Banner colour','select',{opts:[[0,'Teal'],[1,'Violet'],[2,'Amber'],[3,'Rose'],[4,'Green']]})}${F('logo','Organisation logo (file name)','text',{ph:'logo.png'})}
   ${F('regStart','Registration starts','date')}${F('regEnd','Registration ends','date')}${F('start','Hackathon starts','date')}${F('end','Hackathon ends','date')}
   ${F('att','Supporting attachments','text',{span:1,ph:'Problem statement PDF, rulebook…'})}${F('pub','Publish immediately','check',{span:1})}</div>`,
  save:()=>{const D=S.d;if(!D.title.trim()){toast('Add a hackathon name');return false}if(!D.start||!D.end||!D.regStart||!D.regEnd){toast('Fill in all four dates');return false}if(D.start>D.end||D.regStart>D.regEnd||D.regEnd>D.end){toast('Check the dates: registration must close before the hackathon ends');return false}
   const o={title:D.title.trim(),vis:D.vis,mode:D.mode,desc:D.desc,url:D.url,aud:D.aud,limit:D.limit,skills:D.skills,poc:D.poc,hue:+D.hue||0,regStart:D.regStart,regEnd:D.regEnd,start:D.start,end:D.end,pub:!!D.pub};
   if(h)Object.assign(h,o);else S.hacks.unshift({id:nid('h'),...o,regs:[],ann:[],rounds:['Registration','Final round']});toast(h?'Hackathon updated':'Hackathon created');render()}},
  {title:h?.title||'',vis:h?.vis||'Public',mode:h?.mode||'Online',desc:h?.desc||'',url:h?.url||'',aud:h?.aud||'',limit:h?.limit||'',skills:h?.skills||'',poc:h?.poc||'',hue:h?.hue??0,logo:'',regStart:h?.regStart||iso(2),regEnd:h?.regEnd||iso(14),start:h?.start||iso(18),end:h?.end||iso(20),att:'',pub:h?h.pub:false});
}
A.previewHack=d=>{const h=by(S.hacks,d.id);openModal({title:'Participant preview',foot:`<button class="btn ghost" data-act="closeModal">Close preview</button>`,body:()=>`<div class="hero-bn">${banner(h.hue)}</div><h2 style="font-size:24px">${esc(h.title)}</h2><div class="tags">${pill(h.vis)}${pill(h.mode)}${pill(hkStatus(h),hkKind(hkStatus(h)))}</div><p>${esc(h.desc)}</p><div class="kv"><div><span>Hackathon dates</span><b>${fd(h.start)} to ${fd(h.end)}</b></div><div><span>Registration</span><b>${fd(h.regStart)} to ${fd(h.regEnd)}</b></div><div><span>For</span><b>${esc(h.aud||'Everyone')}</b></div><div><span>Seats</span><b>${h.limit||'Unlimited'}</b></div></div><div><div class="sub-h" style="margin-bottom:6px">Skills needed</div>${tags(csv(h.skills))}</div><div class="small muted">Contact: ${esc(h.poc||'Not set')}</div><button class="btn" disabled>Register (preview only)</button>`})};
A.manageHack=d=>{
  const h=by(S.hacks,d.id);
  openModal({title:()=>`Manage · ${esc(h.title)}`,wide:true,foot:`<button class="btn ghost" data-act="closeModal">Close</button>`,body:()=>{
   const tab=S.m.tab||'regs',s=hkStatus(h);

   if(tab==='analytics'){const cols={};h.regs.forEach(r=>cols[r.college]=(cols[r.college]||0)+1);const E=Object.entries(cols).sort((a,b)=>b[1]-a[1]);return hd+`<div class="stat"><div><b>${h.regs.length}</b><span>Registrations</span></div><div><b>${h.limit?Math.round(100*h.regs.length/h.limit)+'%':'—'}</b><span>Seats filled</span></div><div><b>${E.length}</b><span>Colleges</span></div></div>${E.length?`<div class="sub-h">Registrations by college</div><div class="list">${E.map(([c,n])=>`<div class="scorebar"><span>${esc(c)}</span><div class="prog" style="height:10px"><i style="width:${100*n/h.regs.length}%"></i></div><b class="tnum">${n}</b></div>`).join('')}</div>`:'<div class="small muted">Analytics fill in once participants register.</div>'}`}
   if(tab==='flow')return hd+`<div class="list">${h.rounds.map((r,i)=>`<div class="li"><span class="av" style="width:26px;height:26px;background:var(--surface-2);color:var(--ink-2)">${i+1}</span><div class="grow"><b>${esc(r)}</b></div></div>`).join('')}</div>${s!=='Expired'?`<div class="toolbar"><div style="flex:1;min-width:200px">${F('hr','','text',{ph:'Add a process step, for example "Mentor review"'})}</div><button class="btn ghost sm" data-act="addHr" data-id="${h.id}">Add process</button></div>`:''}<div class="tags"><button class="btn ghost sm" disabled>Manage assessment · coming soon</button><button class="btn ghost sm" disabled>Schedule interview · coming soon</button></div>`;
   return hd+`<div class="list">${h.ann.length?h.ann.map(a=>`<div class="li"><div class="grow">${esc(a)}</div></div>`).join(''):'<div class="small muted">No announcements yet.</div>'}</div><div class="toolbar"><div style="flex:1;min-width:200px">${F('ha','','text',{ph:'Write an announcement'})}</div><button class="btn sm" data-act="addHa" data-id="${h.id}">Post</button></div>`;
  }},{hr:'',ha:''},{tab:'regs'});
};
A.certOne=d=>{by(by(S.hacks,d.id).regs,d.r).cert=true;toast('Certificate issued');renderModal()};
A.certAll=d=>{by(S.hacks,d.id).regs.forEach(r=>r.cert=true);toast('Certificates issued to all participants');renderModal()};
A.addHr=d=>{if(!S.d.hr.trim())return;by(S.hacks,d.id).rounds.push(S.d.hr.trim());S.d.hr='';renderModal()};
A.addHa=d=>{if(!S.d.ha.trim())return;by(S.hacks,d.id).ann.unshift(S.d.ha.trim());S.d.ha='';toast('Announcement posted');renderModal()};

/* ============ meetings ============ */
VIEWS.meetings=()=>{
  const t=S.q.mftab||'upcoming',q=(S.q.mfq||'').toLowerCase();
  const all=mSorted(),up=all.filter(m=>!mPast(m)),pa=all.filter(mPast).reverse();
  const L=(t==='upcoming'?up:t==='past'?pa:all).filter(m=>!q||(m.name+m.participants.map(p=>p.email).join(' ')).toLowerCase().includes(q));
  return head('Meetings','Schedule interviews, join them, and review recordings and coding submissions afterwards.',`<button class="btn" data-act="newMeeting">${ic('plus',16)} Schedule meeting</button>`)
  +`<div class="toolbar">${segs('mftab',[['upcoming','Upcoming',up.length],['past','Past',pa.length],['all','All',all.length]],'upcoming')}${searchBox('mfq','Search by meeting name or participant email')}</div>`
  +(L.length?`<div class="tw"><table><thead><tr><th>Meeting</th><th>Date</th><th>Time</th><th>Participants</th><th>Access</th><th></th></tr></thead><tbody>${L.map(m=>`<tr><td><b>${esc(m.name)}</b>${m.rec?`<div class="small muted">${ic('video',13)} Recording available</div>`:''}</td><td class="tnum">${fd(m.date)}</td><td class="tnum">${m.start}–${m.end}</td><td><div style="display:flex">${m.participants.slice(0,3).map(p=>`<span style="margin-right:-8px">${av(p.name,28)}</span>`).join('')}</div></td><td>${pill(m.vis)}</td><td style="white-space:nowrap">${mPast(m)?'':`<button class="btn sm" data-act="join" data-id="${m.id}">Join</button> `}<button class="btn ghost sm" data-act="meetDetail" data-id="${m.id}">Details</button></td></tr>`).join('')}</tbody></table></div>`:empty('No meetings found','Change the filter or schedule a new meeting.',`<button class="btn sm" data-act="newMeeting">Schedule meeting</button>`));
};
A.newMeeting=()=>{
  openModal({title:'Schedule meeting',cta:'Schedule',body:()=>`<div class="form">${F('name','Meeting name','text',{span:1,ph:'e.g. Technical interview: Candidate name'})}${F('date','Date','date')}<div class="form" style="grid-template-columns:1fr 1fr;gap:10px">${F('start','Starts','time')}${F('end','Ends','time')}</div>
   ${F('people','Participant emails','textarea',{span:1,rows:2,ph:'candidate@college.edu, panelist@nimbus.example'})}${F('message','Custom meeting message','textarea',{span:1,rows:2})}${F('pw','Interview password','text',{ph:'Optional'})}${F('vis','Meeting access','select',{opts:['Invite Only','Public Link']})}${F('mod','Enable moderator controls','check',{span:1})}</div>`,
  save:()=>{const D=S.d;if(!D.name.trim()||!D.date){toast('Add a meeting name and date');return false}if(D.start>=D.end){toast('End time must be after the start time');return false}
   const ps=parseEmails(D.people||'');if(ps.some(e=>!emailOk(e))){toast('One or more participant emails look wrong');return false}
   S.meetings.push({id:nid('t'),name:D.name.trim(),date:D.date,start:D.start,end:D.end,participants:ps.map(e=>({name:e.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,x=>x.toUpperCase()),email:e})),message:D.message,pw:D.pw,mod:D.mod,vis:D.vis,rec:false,subs:[]});toast('Meeting scheduled');S.q.mftab='upcoming';render()}},
  {name:'',date:iso(1),start:'11:00',end:'11:45',people:'',message:'',pw:'',vis:'Invite Only',mod:true});
};
A.meetDetail=d=>{
  const m=by(S.meetings,d.id);
  openModal({title:()=>esc(m.name),wide:true,foot:`<button class="btn ghost" data-act="closeModal">Close</button>`,body:()=>{
   const tab=S.m.tab||'info',T=[['info','Details'],['ppl','Participants'],['rec','Recording'],['code','Code submissions']];
   const hd=`<div class="seg">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="setm" data-k="tab" data-v="${k}">${l}</button>`).join('')}</div>`;
   if(tab==='info')return hd+`<div class="kv"><div><span>Date</span><b>${fd(m.date)}</b></div><div><span>Time</span><b>${m.start} to ${m.end}</b></div><div><span>Access</span><b>${m.vis}</b></div><div><span>Password</span><b>${m.pw?'Set':'None'}</b></div><div><span>Moderator controls</span><b>${m.mod?'On':'Off'}</b></div></div>${m.message?`<p>${esc(m.message)}</p>`:''}<div class="li"><div class="grow small" style="word-break:break-all">https://match.myanatomy.example/join/${m.id}</div><button class="btn ghost sm" data-act="copyText" data-v="https://match.myanatomy.example/join/${m.id}">${ic('copy',14)} Copy link</button></div>`;
   if(tab==='ppl')return hd+`<div class="list">${m.participants.map(p=>`<div class="li">${av(p.name,32)}<div class="grow"><b>${esc(p.name)}</b><span class="small muted">${esc(p.email)}</span></div></div>`).join('')}</div>`;
   if(tab==='rec')return hd+(m.rec?`<div class="vid"><button class="iconbtn" style="width:64px;height:64px;background:rgba(255,255,255,.16);color:#fff" data-act="playRec" aria-label="${S.m.play?'Pause':'Play'} recording">${S.m.play?ic('x',26):ic('play',26)}</button><div class="pb"><i style="width:${S.m.play?'38%':'0%'}"></i></div></div><div class="small muted">Recorded session · ${m.start} to ${m.end}. Playback is simulated in this prototype.</div>`:empty('No recording','Recordings appear here after a recorded meeting ends.'));
   return hd+(m.subs.length?m.subs.map(s=>`<div><div class="toolbar"><b>${esc(s.who)}</b>${pill(s.lang,'info')}<span class="sp"></span><button class="btn ghost sm" data-act="copyCode" data-m="${m.id}" data-i="${m.subs.indexOf(s)}">${ic('copy',14)} Copy code</button></div><pre class="code">${esc(s.code)}</pre></div>`).join(''):empty('No coding submissions','Code written during the interview shows up here.'));
  }},{},{tab:'info',play:false});
};
A.playRec=()=>{S.m.play=!S.m.play;renderModal()};
A.copyCode=d=>copy(by(S.meetings,d.m).subs[+d.i].code,'Code copied');
A.join=d=>{
  const m=by(S.meetings,d.id);
  openModal({title:()=>S.m.in?esc(m.name):'Join interview',foot:()=>S.m.in?`<button class="btn danger" data-act="leave">${ic('phoneoff',16)} Leave</button>`:`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="joinNow" data-id="${m.id}">Join now</button>`,body:()=>S.m.in?
   `<div class="two">${m.participants.slice(0,2).concat([{name:'Cavalien'}]).slice(0,4).map(p=>`<div class="vid" style="aspect-ratio:4/3">${av(p.name,64)}<span style="position:absolute;left:10px;bottom:8px;font-size:12px">${esc(p.name)}</span></div>`).join('')}</div><div class="small muted" style="text-align:center">You are in the interview lobby preview. Audio and video need the full platform.</div>`
   :`<div class="kv"><div><span>Date</span><b>${fd(m.date)}</b></div><div><span>Time</span><b>${m.start} to ${m.end}</b></div><div><span>Participants</span><b>${m.participants.length}</b></div></div>${m.pw?F('jpw','Interview password','password',{ph:'Ask the organiser'})+(S.m.bad?'<div class="small" style="color:var(--bad)">That password is not right.</div>':''):'<div class="small muted">No password needed for this meeting.</div>'}`},{jpw:''},{in:false,bad:false});
};
A.joinNow=d=>{const m=by(S.meetings,d.id);if(m.pw&&S.d.jpw!==m.pw){S.m.bad=true;renderModal();return}S.m.in=true;renderModal()};
A.leave=()=>{closeModal();toast('You left the interview')};

/* ============ NCET analytics ============ */
VIEWS.ncet=()=>{
  const yr=S.q.nyear||'2026',f=YF[yr],q=(S.q.nq||'').toLowerCase(),sel=S.mapState;
  const scope=S.colleges.filter(c=>(!q||(c.name+c.city).toLowerCase().includes(q))&&(q||!sel||c.state===sel));
  const sum=k=>Math.round(scope.reduce((a,c)=>a+c[k]*f,0));
  return head('NCET Analytics','Find participating colleges across India and see NCET participation for the year you choose.','')
  +`<div class="toolbar"><select id="q_nyear" data-q="nyear" aria-label="Year">${Object.keys(YF).map(y=>`<option ${y===yr?'selected':''}>${y}</option>`).join('')}</select>${searchBox('nq','Search colleges by name or city')}${sel?`<button class="chip on" data-act="mapState" data-id="${sel}">${ST[sel][0]}</button>`:''}</div>
  <div class="g2"><div class="card pad" style="display:flex;flex-direction:column;gap:12px"><div class="sub-h">NCET attempts by state, ${yr}</div>${tileMap(yr,sel,false)}<div class="heat"><span>Fewer attempts</span><i></i><span>More</span></div><div class="small muted map-note">Each square is a state or union territory. Together the squares form a map of India. Select a state to list its colleges.</div></div>
  <div class="card pad" style="display:flex;flex-direction:column;gap:12px"><div class="stat"><div><b>${sum('tot').toLocaleString('en-IN')}</b><span>Total candidates</span></div><div><b>${sum('att').toLocaleString('en-IN')}</b><span>NCET attempts</span></div><div><b>${sum('rec').toLocaleString('en-IN')}</b><span>MAPIT recommendations</span></div></div>
   <div class="sub-h">${q?'Search results':sel?ST[sel][0]:'All verified colleges'} · ${scope.length}</div>
   <div class="list sc" style="max-height:360px;overflow:auto">${scope.length?scope.map(c=>`<label class="li" for="ns_${c.id}"><input type="checkbox" id="ns_${c.id}" data-act="nSel" data-id="${c.id}" ${S.nsel.includes(c.id)?'checked':''}><div class="grow"><b>${esc(c.name)}</b><span class="small muted">${esc(c.city)}, ${ST[c.state][0]} · ${c.stream}</span><span class="small tnum">${Math.round(c.tot*f).toLocaleString('en-IN')} candidates · ${Math.round(c.att*f).toLocaleString('en-IN')} attempts · ${Math.round(c.rec*f)} recommended</span></div></label>`).join(''):empty('No colleges found','Try another state, year or search.')}</div>
   <button class="btn" ${S.nsel.length?'':'disabled'} data-act="ncetEvent">${ic('plus',16)} Create campus event${S.nsel.length?` (${S.nsel.length} college${S.nsel.length>1?'s':''})`:''}</button></div></div>`;
};
A.mapState=d=>{S.mapState=S.mapState===d.id?null:d.id;S.q.nq='';render()};
A.nSel=d=>{const i=S.nsel.indexOf(d.id);i<0?S.nsel.push(d.id):S.nsel.splice(i,1);render()};
A.ncetEvent=()=>{const c=[...S.nsel];S.nsel=[];eventModal({colleges:c})};

/* ============ jobs + event requests ============ */
const initials=t=>(String(t).match(/[A-Za-z0-9]+/g)||['?']).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const agoTxt=d=>{const n=-dd(d);return n<=0?'Today':n===1?'Yesterday':n+' days ago'};
VIEWS.jobs=()=>{
  const q=(S.q.jq||'').toLowerCase(),loc=S.q.jloc||'All',locs=[...new Set(S.jobs.map(j=>j.loc))];
  const reqN=j=>S.reqs.filter(r=>r.job===j.id).length;
  const list=S.jobs.filter(j=>(!q||(j.title+' '+j.skills+' '+j.loc).toLowerCase().includes(q))&&(loc==='All'||j.loc===loc));
  const linked=S.jobs.filter(j=>reqN(j)>0).length;
  const stat=(i,l,n,sub,t)=>`<div class="kp"><span class="kp-i ${t}">${ic(i,20)}</span><span class="kp-t"><span>${l}</span><b class="tnum">${n}</b><small>${sub}</small></span></div>`;
  return head('Jobs','Roles you have saved. Create, modify and review them here.',`<button class="btn" data-act="newJob">${ic('plus',16)} Create job</button>`)
  +`<div class="kps kps-row">${stat('brief','Open roles',S.jobs.length,'Saved in MATCH','t1')}${stat('cal','Used in event requests',linked,`of ${S.jobs.length} roles`,'t2')}${stat('pin','Locations',locs.length,'Where you are hiring','t3')}</div>
  <div class="toolbar">${searchBox('jq','Search by title, skill or location')}<select id="q_jloc" data-q="jloc" aria-label="Location"><option value="All">All locations</option>${locs.map(l=>`<option ${l===loc?'selected':''}>${esc(l)}</option>`).join('')}</select><span class="small muted tnum" style="margin-left:auto">${list.length} of ${S.jobs.length} roles</span></div>
  ${list.length?`<div class="jb-grid">${list.map(j=>{const sk=csv(j.skills),n=reqN(j);return `<article class="jb">
    <div class="jb-top"><span class="jb-ico ${j.color}">${esc(initials(j.title))}</span><div class="jb-t"><h3>${esc(j.title)}</h3><span class="jb-loc">${ic('pin',14)} ${esc(j.loc)}</span></div></div>
    <div class="jb-pay"><span>Salary range</span><b class="tnum">${salary(j)}</b></div>
    <p class="jb-desc">${esc(j.desc||'No description added yet.')}</p>
    ${sk.length?tags([...sk.slice(0,4),...(sk.length>4?['+'+(sk.length-4)]:[])]):''}
    <div class="jb-foot"><span class="small muted">${n?`${n} event request${n>1?'s':''}`:'No event requests yet'}</span><span class="jb-acts"><button class="btn ghost sm" data-act="viewJob" data-id="${j.id}">View</button><button class="iconbtn jb-edit" data-act="editJob" data-id="${j.id}" aria-label="Edit ${esc(j.title)}">${ic('edit',16)}</button></span></div></article>`}).join('')}</div>`
  :empty('No roles match','Try a different search or location.',`<button class="btn sm" data-act="newJob">Create job</button>`)}`;
};
A.viewJob=d=>{const j=by(S.jobs,d.id);openModal({title:()=>esc(j.title),foot:()=>`<button class="btn ghost" data-act="closeModal">Close</button><button class="btn" data-act="editJob" data-id="${j.id}">Edit job</button>`,body:()=>`<div class="kv"><div><span>Salary</span><b>${salary(j)}</b></div><div><span>Location</span><b>${esc(j.loc)}</b></div><div><span>Linked event requests</span><b>${S.reqs.filter(r=>r.job===j.id).length}</b></div></div><p>${esc(j.desc)}</p>${tags(csv(j.skills))}`})};
A.newJob=()=>jobModal(null);A.editJob=d=>jobModal(by(S.jobs,d.id));
function jobModal(j){
  openModal({title:j?'Edit job':'Create job',cta:j?'Save changes':'Create job',body:()=>`<div class="form">${F('title','Job title','text',{span:1})}${F('min','Minimum pay','number',{min:0,step:'any'})}${F('max','Maximum pay','number',{min:0,step:'any'})}${F('unit','Pay unit','select',{opts:[['LPA','Lakh per annum (LPA)'],['per month','Per month (₹)']]})}${F('loc','Location','text',{ph:'City, State'})}${F('skills','Skills','text',{span:1,ph:'Java, SQL'})}${F('desc','Job description','textarea',{span:1,rows:4})}</div>`,
  save:()=>{const D=S.d;if(!D.title.trim()||!D.loc.trim()){toast('Add a job title and a location');return false}if(!D.min||!D.max||+D.min>+D.max){toast('Enter a pay range where the minimum is not above the maximum');return false}
   const o={title:D.title.trim(),min:D.min,max:D.max,unit:D.unit,loc:D.loc.trim(),skills:D.skills,desc:D.desc};
   if(j)Object.assign(j,o);else S.jobs.unshift({id:nid('j'),...o,color:campTone[S.jobs.length%5]});toast(j?'Job updated':'Job created');render()}},
  {title:j?.title||'',min:j?.min||'',max:j?.max||'',unit:j?.unit||'LPA',loc:j?.loc||'',skills:j?.skills||'',desc:j?.desc||''});
}
const REQ_FLOW=['Pending','In review','Approved','Completed'];
VIEWS.requests=()=>{
  const st=S.q.rstat||'All',q=(S.q.rq||'').toLowerCase();
  const roleOf=r=>r.job?jobById(r.job)?.title:r.role||'No role linked';
  const cnt=k=>k==='All'?S.reqs.length:S.reqs.filter(r=>r.status===k).length;
  const list=S.reqs.filter(r=>(st==='All'||r.status===st)&&(!q||(r.title+' '+roleOf(r)).toLowerCase().includes(q)));
  const stat=(i,l,n,sub,t)=>`<div class="kp"><span class="kp-i ${t}">${ic(i,20)}</span><span class="kp-t"><span>${l}</span><b class="tnum">${n}</b><small>${sub}</small></span></div>`;
  const waiting=cnt('Pending')+cnt('In review');
  return head('Event Requests','Every event you have submitted, with its current status.',`<button class="btn ghost" data-act="helpReq">${ic('help',16)} Need help?</button><button class="btn" data-act="newEvent">${ic('plus',16)} New event</button>`)
  +`<div class="kps kps-row">${stat('inbox','All requests',S.reqs.length,'Submitted so far','t1')}${stat('clip','Awaiting approval',waiting,`${cnt('Pending')} pending, ${cnt('In review')} in review`,'t3')}${stat('check','Approved',cnt('Approved'),'Ready to run','t2')}${stat('award','Completed',cnt('Completed'),'Finished events','t4')}</div>
  <div class="toolbar"><div class="seg">${['All',...REQ_FLOW].map(k=>`<button class="${st===k?'on':''}" data-act="setq" data-k="rstat" data-v="${k}">${k}<span class="n">${cnt(k)}</span></button>`).join('')}</div>${searchBox('rq','Search by event or role')}</div>
  ${list.length?`<div class="rq-list">${list.map(r=>{const cur=REQ_FLOW.indexOf(r.status),tone=r.status==='Approved'||r.status==='Completed'?'good':'warn',j=r.job?jobById(r.job):null,nc=r.colleges.length;return `<article class="rq">
    <div class="rq-main"><span class="jb-ico ${r.color}">${ic('cal',20)}</span><div class="rq-t"><h3>${esc(r.title)}</h3><span class="rq-meta">${ic('brief',14)} ${esc(roleOf(r))}${j?` · ${salary(j)}`:''}</span><span class="rq-meta">${ic('cal',14)} Raised ${fd(r.raised)} · ${agoTxt(r.raised)}${nc?` · ${nc} college${nc>1?'s':''}`:''}</span></div></div>
    <ol class="rq-steps" aria-label="Progress: ${esc(r.status)}">${REQ_FLOW.map((k,i)=>`<li class="${i<cur?'done':i===cur?'now':''}"><i>${i<cur?ic('check',12):''}</i><span>${k}</span></li>`).join('')}</ol>
    <div class="rq-end">${pill(r.status,tone)}<button class="btn ghost sm" data-act="reqInfo" data-id="${r.id}">More info ${ic('chevR',14)}</button></div></article>`}).join('')}</div>`
  :empty('No requests found',st==='All'&&!q?'Create an event to raise your first request.':'Try another status or search.',`<button class="btn sm" data-act="newEvent">New event</button>`)}`;
};
A.reqInfo=d=>{const r=by(S.reqs,d.id),j=r.job?jobById(r.job):null,ev=S.events.find(e=>e.title===r.title);
  openModal({title:()=>esc(r.title),foot:`<button class="btn ghost" data-act="closeModal">Close</button>`,body:()=>`<div class="kv"><div><span>Status</span><b>${r.status}</b></div><div><span>Raised on</span><b>${fd(r.raised)}</b></div>${ev?`<div><span>Event dates</span><b>${fd(ev.start)} to ${fd(ev.end)}</b></div>`:''}</div>
   <div><div class="sub-h" style="margin-bottom:6px">Job details</div>${j?`<div class="li"><div class="grow"><b>${esc(j.title)}</b><span class="small muted">${salary(j)} · ${esc(j.loc)}</span></div></div>`:`<div class="small muted">${esc(r.role||'No job linked')}</div>`}</div>
   <div><div class="sub-h" style="margin-bottom:6px">Colleges that accepted or participated</div>${(ev?ev.colleges.filter(c=>c[1]==='Accepted').map(c=>by(S.colleges,c[0]).name):r.colleges).length?`<div class="list">${(ev?ev.colleges.filter(c=>c[1]==='Accepted').map(c=>by(S.colleges,c[0]).name):r.colleges).map(n=>`<div class="li"><div class="grow"><b>${esc(n)}</b></div>${pill('Accepted','good')}</div>`).join('')}</div>`:'<div class="small muted">No college has accepted yet.</div>'}</div>`})};
A.helpReq=()=>openModal({title:'Need help with an event?',foot:`<button class="btn" data-act="closeModal">Got it</button>`,body:()=>`<p>Your MyAnatomy account team can help with event approvals, college outreach and scheduling.</p><div class="list"><div class="li">${av('Account Manager',34)}<div class="grow"><b>Account manager</b><span class="small muted">Sample contact: add your team's details here</span></div></div><div class="li">${av('Campus Support',34)}<div class="grow"><b>Campus support desk</b><span class="small muted">Weekdays, 10:00 to 18:00 IST</span></div></div></div>`});

/* ============ company profile + assessments ============ */
VIEWS.profile=()=>{const c=S.company;return head('Company Profile','How your organisation appears to colleges and candidates on MATCH.',`<button class="btn" data-act="editProfile">${ic('edit',16)} Edit profile</button>`)
 +`<div class="g2"><div class="card pad" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:14px;align-items:center">${av(c.name,56)}<div><h2 style="font-size:22px">${esc(c.name)}</h2><span class="muted">${esc(c.city)}</span></div></div><p>${esc(c.about)}</p></div>
 <div class="card pad"><div class="sub-h" style="margin-bottom:10px">Contact</div><div class="list"><div class="li">${ic('mail',16)}<span class="grow">${esc(c.email)}</span></div><div class="li">${ic('users',16)}<span class="grow">${esc(c.phone)}</span></div><div class="li">${ic('pin',16)}<span class="grow">${esc(c.city)}</span></div><div class="li">${ic('globe',16)}<a class="grow" href="${esc(c.web)}" target="_blank" rel="noopener">${esc(c.web)}</a></div><div class="li">${ic('ext',16)}<a class="grow" href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn page</a></div></div></div>
 <div class="card pad"><div class="sub-h" style="margin-bottom:10px">Awards and achievements</div><div class="list">${csv(c.awards).map(a=>`<div class="li">${ic('award',16)}<span class="grow">${esc(a)}</span></div>`).join('')}</div></div>
 <div class="card pad"><div class="sub-h" style="margin-bottom:10px">Technologies</div>${tags(csv(c.tech))}</div></div>`};
A.editProfile=()=>openModal({title:'Edit company profile',wide:true,body:()=>`<div class="form">${F('name','Company name','text',{span:1})}${F('about','About the company','textarea',{span:1,rows:3})}${F('email','Contact email','email')}${F('phone','Phone','text')}${F('city','Location','text')}${F('web','Website','url')}${F('linkedin','LinkedIn profile','url',{span:1})}${F('awards','Awards and achievements','text',{span:1,hint:'Comma separated.'})}${F('tech','Technologies','text',{span:1,hint:'Comma separated.'})}</div>`,save:()=>{if(!S.d.name.trim()){toast('Company name is required');return false}Object.assign(S.company,S.d);toast('Profile saved');render()}},{...S.company});
VIEWS.assess=()=>head('My Assessments','MAPIT is MyAnatomy’s assessment platform. Create, run and review hiring assessments there.','')
 +`<div class="g2"><div class="promo"><div><h2>MyAnatomy Professional Intelligence Test</h2><p>AI-powered assessments to measure critical skills, backed by proctoring technology built to keep evaluation cheat-free.</p><div class="acts"><button class="btn" data-act="goMapit">Go to MAPIT ${ic('ext',15)}</button><button class="btn ghost" data-act="demo">Request a demo</button></div></div></div>
  <div class="card pad"><div class="sub-h" style="margin-bottom:10px">What you can do in MAPIT</div><div class="list">${['Create hiring assessments and AI-based interviews','Set up assignments and evaluation workflows','Evaluate technical and non-technical skills','Run proctored assessments for secure evaluation'].map(t=>`<div class="li">${ic('check',16)}<span class="grow">${t}</span></div>`).join('')}</div></div></div>
  <div class="card pad"><div class="sub-h" style="margin-bottom:10px">How it connects to MATCH</div><div class="two" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${[['Build','Create the assessment template in MAPIT.'],['Attach','Add it to a course module, event round or hackathon here in MATCH.'],['Review','Open results in MAPIT and shortlist candidates back in MATCH.']].map(([a,b])=>`<div class="kv"><div style="grid-column:1/-1"><b>${a}</b><span style="font-size:13px;margin-top:2px">${b}</span></div></div>`).join('')}</div></div>
  <div class="card pad"><div class="sub-h" style="margin-bottom:4px">New to MAPIT?</div><div class="small muted" style="margin-bottom:12px">Get a feel for the platform before you are redirected.</div><div class="two" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${[['Request a demo','A guided walkthrough of assessments and AI interviews.','demo','Request demo'],['Watch the overview','A short product video on how MAPIT works.','mapitVideo','Watch video'],['Talk to sales','Pricing, plans and setting up your account.','contactSales','Contact sales']].map(([a,b,act,l])=>`<div class="kv"><div style="grid-column:1/-1"><b>${a}</b><span style="font-size:13px;margin:2px 0 10px;display:block">${b}</span><button class="btn ghost sm" data-act="${act}">${l}</button></div></div>`).join('')}</div></div>`;
A.mapitVideo=()=>toast('The overview video will be added here. Use Request a demo for a walkthrough meanwhile.');
A.contactSales=()=>openModal({title:'Contact the MAPIT sales team',foot:`<button class="btn" data-act="closeModal">Got it</button>`,body:()=>`<p>Our team can walk you through MAPIT plans, proctoring options and how assessments connect to your MATCH events.</p><div class="list"><div class="li">${av('MAPIT Sales',34)}<div class="grow"><b>MAPIT sales desk</b><span class="small muted">Sample contact: add the sales email and phone here</span></div></div><div class="li">${av('Support',34)}<div class="grow"><b>Weekdays, 10:00 to 18:00 IST</b><span class="small muted">Typical reply within one working day</span></div></div></div>`});
A.goMapit=()=>openModal({title:'You are about to open MAPIT',foot:()=>`<button class="btn ghost" data-act="closeModal">Stay in MATCH</button><a class="btn" href="https://myanatomy.ai" target="_blank" rel="noopener" data-act="closeModal">Continue to MAPIT ${ic('ext',15)}</a>`,body:()=>`<p>MAPIT opens in a new tab. You will land on the MAPIT dashboard, where you can find or create the assessment template you need.</p>`});
A.demo=()=>openModal({title:'Request a MAPIT demo',cta:'Send request',body:()=>`<div class="form">${F('dn','Your name','text',{span:1})}${F('de','Work email','email',{span:1})}${F('dm','What would you like to assess?','textarea',{span:1,rows:3})}</div>`,save:()=>{if(!S.d.dn.trim()||!emailOk(S.d.de||'')){toast('Add your name and a valid email');return false}toast('Request noted. The MyAnatomy team will reach out.')}},{dn:'Cavalien',de:'',dm:''});

/* ============ boot ============ */
try{const t=localStorage.getItem('match-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
{const v=location.hash.slice(1);if(VIEWS[v])S.view=v}
render();
</script>

</body></html>
